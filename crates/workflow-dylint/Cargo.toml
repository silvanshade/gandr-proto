#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-workflow-dylint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Project-local Dylint rules for gandr Rust type boundaries"
license.workspace = true
publish.workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[lib]
crate-type = ["cdylib"]

# rustc_private driver code builds only under the pinned nightly (see the
# crate-local `.cargo/config.toml`, which the `dylint_testing` UI build reads
# because cargo runs its builds with the package dir as CWD). The workspace
# lint wall is not yet applied to this crate: it predates the wall and is
# checked with plain `-D warnings`, matching the posture it had as a
# standalone workspace (tracked by gandr-3yh).
[dependencies]
clippy_utils = { workspace = true }
dylint_linting = { workspace = true }

[dev-dependencies]
dylint_testing = { workspace = true }

[features]
default = []
full = []
