#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-theory-computads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The elaborator seam for the cell-rewriting stack: levitation descriptions elaborated into cells, circuit-rule instantiation at the site where the shift question is well-posed, and reification of the cell grammar back into the frozen command arena"
