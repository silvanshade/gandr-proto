[dependencies]
gandr-core-sequent.workspace = true
gandr-theory-cell-complexes.workspace = true
gandr-theory-coherent-resolutions.workspace = true
gandr-theory-deep-inference.workspace = true
gandr-theory-levitation.workspace = true

[dev-dependencies]
gandr-theory-cell-complexes-tools.workspace = true
proptest.workspace = true

[features]
default = []
full = []

[lints]
workspace = true
