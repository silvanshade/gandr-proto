#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-kernel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The minimal certified kernel's S1 core -- the pure polarized CBPV value/computation term and type language, the Def/Axiom declaration vocabulary, the append-only environment and its single add_decl choke point (with the one warned bypass and a print-axioms audit), the zero-inference S1 checker, and the C5-quarantined definitional-equality conversion (ADR-77/78; docs/gandr/spec/kernel-boundary.md slice 3)"
license.workspace = true
publish.workspace = true

# TCB dependency wall (kernel-boundary.md section 2): a gandr-kernel-* crate
# depends only on other gandr-kernel-* crates and core/alloc. Dev-dependencies
# are exempt -- test code is not shipped trust.
[dependencies]
gandr-kernel-strata = { path = "../kernel-strata" }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
full = []

[lints]
workspace = true
