#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-core-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core CBPV term substrate for the gandr language: syntax, types, contexts, substitution, interning, effect rows, usage grades, builtins, and the shared error and wrapper vocabulary"
license.workspace = true
publish.workspace = true

[dependencies]
# The nominal atom substrate (ADR-41). This crate names its `Sort` trait and
# `Unifiability`, and nothing else: `nominal::GandrSort` is the sort vocabulary
# every machine-minted name-space is tagged with, and the trait impl is what
# draws the atom-role/variable-role boundary. Minting happens in the crates that
# allocate — the lowerer holds the `Gensym`s.
gandr-theory-nominal-automata.workspace = true
no-panic.workspace = true
regex = { workspace = true, optional = true }
thiserror.workspace = true

[features]
default = []
full = ["gandr_feat_regex"]
# Regex-backed builtins (`regex.extract`, `string.escape`); pulls in the
# workspace `regex`. Off by default.
gandr_feat_regex = ["dep:regex"]

[lints]
workspace = true
