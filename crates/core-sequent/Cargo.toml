#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-core-sequent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The polarized System-L command IL, the static focusing translation from the checked CBPV core, and the L machine (sequent-machines phases L0/L1; ADR-65, proposal-sequent-kernel.md sections 2-4)"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "sequent"
path = "tests/lib.rs"

[features]
default = []
full = ["gandr_feat_regex"]
# Passthrough of core-checker's regex-backed builtins so the ported conformance
# soundness rows (`tests/conformance_soundness.rs`) can exercise `regex.extract`
# on the L machine under `--features=full`, exactly as the core-checker
# conformance suite gated them.
gandr_feat_regex = ["gandr-core-checker/gandr_feat_regex"]

[lints]
workspace = true

[dependencies]
gandr-core-checker.workspace = true

[dev-dependencies]
# The S1 kernel (kernel-boundary.md §2): the B2.3 corpus partition sweep
# (`tests/kernel_corpus_partition.rs`) bridges each corpus item through
# `gandr-core-checker`'s kernel bridge into this kernel's choke point and export.
# A test-only edge — the section-2 TCB wall constrains kernel-core's own
# dependencies, never its consumers.
gandr-kernel-core.workspace = true
# The strata level oracle: the B2.3 export exit-gate harness
# (`tests/kernel_export_gate.rs`) reconstructs the kernel-native C5 goldens
# (universe/lift), whose `Level` payloads are strata-typed. A test-only edge,
# parallel to the kernel-core edge above (both crates sit below this one).
gandr-kernel-strata.workspace = true
# The outer content-addressed layer: the exit-gate harness records each item's
# `ArtifactIdentity` (massive-term design §6 — the b3sum-provenance successor)
# as artifact-level provenance, and `storage-prolly-trees` supplies the
# `BlockStore`/`TreeParams` the identity build needs. Test-only edges; both
# storage crates consume kernel-core, never the reverse (acyclic).
gandr-storage-artifact.workspace = true
gandr-storage-prolly-trees.workspace = true
# Live total lowering for the F4 corpus sweeps. This is a test-only back-edge:
# surface-engine consumes core-sequent at runtime, while core-sequent's own
# library graph remains acyclic.
gandr-surface-engine.workspace = true
# BLAKE3 digests the corpus `.sexp` fixtures for the outcome-snapshot sweep's
# provenance guard (`tests/corpus_differential.rs`), matching the `b3sum`
# provenance convention the pre-lowered corpus fixtures already carry.
blake3.workspace = true
proptest.workspace = true
