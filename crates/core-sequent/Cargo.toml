#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-core-sequent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The polarized System-L command IL, the static focusing translation from the checked CBPV core, and the L machine (sequent-machines phases L0/L1; ADR-65, proposal-sequent-kernel.md sections 2-4)"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "sequent"
path = "tests/sequent.rs"

[dependencies]
gandr-core-checker = { path = "../core-checker" }

[dev-dependencies]
# BLAKE3 digests the corpus `.sexp` fixtures for the outcome-snapshot sweep's
# provenance guard (`tests/corpus_differential.rs`), matching the `b3sum`
# provenance convention the pre-lowered corpus fixtures already carry.
blake3 = { workspace = true }
# The S1 kernel (kernel-boundary.md §2): the B2.3 corpus partition sweep
# (`tests/kernel_corpus_partition.rs`) bridges each corpus item through
# `gandr-core-checker`'s kernel bridge into this kernel's choke point and export.
# A test-only edge — the section-2 TCB wall constrains kernel-core's own
# dependencies, never its consumers.
gandr-kernel-core = { path = "../kernel-core" }
proptest = { workspace = true }

[features]
default = []
full = ["gandr_feat_regex"]
# Passthrough of core-checker's regex-backed builtins so the ported conformance
# soundness rows (`tests/conformance_soundness.rs`) can exercise `regex.extract`
# on the L machine under `--features=full`, exactly as the core-checker
# conformance suite gated them.
gandr_feat_regex = ["gandr-core-checker/gandr_feat_regex"]

[lints]
workspace = true
