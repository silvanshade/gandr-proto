#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-core-sequent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The polarized System-L command IL, the static focusing translation from the checked CBPV core, and the L machine (sequent-machines phases L0/L1; ADR-65, proposal-sequent-kernel.md sections 2-4)"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "sequent"
path = "tests/sequent.rs"

[dependencies]
gandr-core-checker = { path = "../core-checker" }

[dev-dependencies]
# BLAKE3 digests the corpus `.sexp` fixtures for the outcome-snapshot sweep's
# provenance guard (`tests/corpus_differential.rs`), matching the `b3sum`
# provenance convention the pre-lowered corpus fixtures already carry.
blake3 = { workspace = true }
proptest = { workspace = true }

[features]
default = []
full = []

[lints]
workspace = true
