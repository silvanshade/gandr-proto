[dependencies]
blake3.workspace = true
gandr-kernel-core.workspace = true
gandr-storage-chunker.workspace = true
gandr-storage-prolly-trees.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
default = []
full = []

[lints]
workspace = true
