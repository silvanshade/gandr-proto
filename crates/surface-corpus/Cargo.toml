#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-surface-corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Executable example corpus for the gandr language: literate model examples, pathological cases, and the end-to-end harness that runs them (ADR-52)"
readme.workspace = true
license.workspace = true
publish.workspace = true
# `examples/` holds gandr source trees (`model/`, `pathological/`), not cargo
# examples; keep cargo from scanning it for Rust example targets.
autoexamples = false
autotests = false

[[test]]
name = "corpus"
path = "tests/lib.rs"

[dependencies]
gandr-core-checker.workspace = true
gandr-core-sequent.workspace = true
gandr-runtime-host.workspace = true
gandr-surface-engine.workspace = true
gandr-theory-levitation.workspace = true

[features]
default = []
# The fixtures remain frozen and hash-checked, but native FFI execution stays
# parked until the FFI crate lands in the reboot.
ffi = []
full = ["regex"]
regex = [
  "gandr-core-checker/gandr_feat_regex",
  "gandr-surface-engine/regex",
]

[lints]
workspace = true
