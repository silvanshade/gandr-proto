#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-surface-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Resumable push-machine melder and obligation taxonomy over the checked gandr PBG"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "parser"
path = "tests/lib.rs"

[dependencies]
# The checked precedence-bounded grammar: the `Pbg`, its rules and molds, and
# the `built_in` surface grammar the melder pushes over. It re-exports the
# precedence-DAG types (`Prec`/`PrecDag`/`PrecSpec`), so the parser needs no
# direct `gandr-theory-graphs` edge.
gandr-surface-grammar.workspace = true
# The flat-arena CST (`Cst`/`CstBuilder`) the committed melder replays into,
# plus the interned mold/source/offset vocabulary.
gandr-surface-syntax.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
default = []
full = []

[lints]
workspace = true
