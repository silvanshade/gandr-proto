#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-surface-grammar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Checked precedence-bounded grammar core over gandr precedence DAGs"
license.workspace = true
publish.workspace = true
autotests = false
autobenches = false

[[test]]
name = "surface"
path = "tests/lib.rs"

[[bench]]
harness = false
name = "walk_index"

[dependencies]
# The shared highlight-role vocabulary (`HlRole`/`HlSpan`) the mold highlighter
# classifies into. The wire codecs stay off (they live behind the non-default
# `codecs` feature) — highlighting is in-process plain data; wire consumers
# re-enable them.
gandr-surface-render-remote.workspace = true
gandr-surface-syntax.workspace = true
# The precedence DAG (`prec::*`) plus the finite walk-machine engine the
# generative walk-index front-end instantiates for the real gandr PBG.
gandr-theory-graphs.workspace = true

[dev-dependencies]
criterion.workspace = true
# DEV-ONLY, and only ever dev-only: the parser depends on the grammar, so the
# reverse edge is the deliberate cycle-break — it exists solely to drive the
# restored surface-acceptance `contracts` suite (tests/contracts.rs).
gandr-surface-parser.workspace = true

[features]
default = []
full = []

[lints]
workspace = true
