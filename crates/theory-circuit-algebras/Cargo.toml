#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-theory-circuit-algebras"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Machinery over the cell-alphabet seam at the ruled circuit-terms boundary: interface bookkeeping, embedding-based matching with its convexity check, and diagram normal form — never the port-bijection representation, and never the cell, overlap, completion, or tracelet engines"
license.workspace = true
publish.workspace = true

[dependencies]
gandr-theory-cell-complexes.workspace = true

# The ruled tier-5 dependency is `theory-computads` alone. `core-sequent` is a
# TEST-ONLY dependency: the spine reading's fixtures are command patterns, and a
# cut carries the core IL's polarity, which this crate never names in shipping
# code and never depends on at run time.
[dev-dependencies]
gandr-core-sequent.workspace = true

[features]
default = []
full = []

[lints]
workspace = true
