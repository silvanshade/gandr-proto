#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-core-checker-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared proptest generators for the core CBPV syntax and types, and the checker-versus-machine conformance suite that exercises them"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "conformance"
path = "tests/lib.rs"

[dependencies]
# The core CBPV term substrate these generators build terms over. The edge is a
# library dependency because `strategies` names `ValueType`, `CompType`, and
# `Grade` in its public signatures.
gandr-core-term.workspace = true
proptest.workspace = true

[dev-dependencies]
# The two typing faces the conformance suite compares. Only the suite names
# them, so both edges are test-only: a consumer of the generators links the
# substrate and nothing above it.
gandr-core-checker.workspace = true
gandr-core-machine.workspace = true

[features]
default = []
# Regex-backed builtins (`regex.extract`, `string.escape`) in the checker, so
# the conformance rows that exercise them are generated rather than skipped.
full = ["gandr-core-checker/full", "gandr-core-machine/full", "gandr-core-term/full"]

[lints]
workspace = true
