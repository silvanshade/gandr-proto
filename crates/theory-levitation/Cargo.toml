#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-theory-levitation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Levitation stage 0 -- datatypes as descriptions: a tagged first-order code universe {1, var, x, sigma} with decidable equality, 2-cell faces as free-monad term pairs, bridge-diagram multi-out arities, and generic programs (equality, serialization, interning) driven by the description (the levitation design's stage ladder)"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "levitation"
path = "tests/lib.rs"

[dependencies]
# The core value-type + grade vocabulary the description leaves decorate: field
# codes carry a `gandr_core_checker::grade::Grade` (V5), the erased usage
# annotation the grade decoder reads into the semiring.
gandr-core-checker.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
default = []
full = []

[lints]
workspace = true
