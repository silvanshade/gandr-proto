#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-workflow-grammatical-framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GF/PGF interop for the gandr documentation pipeline: the GfRuntime trait (the internalization seam) with its PyO3 backend over the pgf binding, and the B' .gfd s-expression surface (builder and reader)"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "lib"
path = "tests/lib.rs"

[dependencies]
# Embedded CPython hosting the pgf binding (see pyproject.toml; uv-managed).
pyo3.workspace = true
# Typed error derive for the crate error vocabulary.
thiserror.workspace = true

[dev-dependencies]
# The raw binding side of the wrapper-parity tests (tests/parity.rs drives
# each wrapper method against the direct Python API call in-process).
pyo3.workspace = true

[lints]
workspace = true
