[project]
name = "gandr-workflow-grammatical-framework"
version = "0.0.0"
description = "Python environment for the gandr-workflow-grammatical-framework PGF interop backend (uv-managed; pgf wheels bundle libpgf/libgu on macOS and Linux)"
requires-python = ">=3.10"
dependencies = ["pgf==1.1"]

[tool.uv]
# The embedded interpreter PyO3 discovers is the PATH-resolved python3; the
# venv MUST be created from that same interpreter (never a uv-managed one),
# or the pgf extension's cpXY tag mismatches at runtime.
python-preference = "only-system"
