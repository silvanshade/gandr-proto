#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-surface-render-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Leaf wire-protocol types for the typing-machine inspection render bus: the versioned frame envelope, machine-state projections, deltas, and the Send-safe present seam"
license.workspace = true
publish.workspace = true

[dependencies]
# The only dependency: `serde` for the optional wire image. Default-off codecs
# keep render-remote as plain in-process data unless a bus, LSP adapter, or test
# enables serialization. Inherits the workspace `derive`+`std` features.
serde = { workspace = true, optional = true }

[dev-dependencies]
# JSON round-trip coverage for the wire schema (gated on the `codecs` feature).
serde_json = { workspace = true }

[features]
default = []
codecs = ["dep:serde"]
full = ["codecs"]

[lints]
workspace = true
