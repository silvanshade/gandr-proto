#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The gandr toolchain driver: script runner, read-evaluate loop, terminal face, and language-server face"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
# The core outcome vocabulary a run terminates in: `ShellOutcome::Completed`
# carries an `Eval`, so classifying a run into a process status means naming
# the substrate's terminal, blame, and stuck cases.
gandr-core-term.workspace = true
# The combined source entry: ordinary shell operations and declared native FFI
# operations share one prepared lowering seam and one host driver.
gandr-runtime-ffi.workspace = true
# Terminal source diagnostics over merged verdict spans.
gandr-surface-diagnostics.workspace = true
# The language-level source entry: retained for the shell-facing API and
# preparation types.
gandr-surface-engine.workspace = true
# The language-server face: `gandr lsp` and `gandr lsp --capabilities`.
gandr-surface-lsp.workspace = true
# The read-evaluate loop: bare `gandr` is the line-editor face.
gandr-surface-repl.workspace = true
# Shared source text wrapper for facade span rendering.
gandr-surface-syntax.workspace = true
# The terminal programming environment: `gandr tui`.
gandr-surface-tui.workspace = true

[dev-dependencies]
gandr-runtime-ffi = { workspace = true, features = [
  "native-fixture",
] }

# Remaining deferred faces: `gandr mcp` / `gandr fmt` / `gandr build` are
# subcommand slots with no implementing crate in the tree. They arrive with
# their real dependency edge, not by uncommenting a line.

[features]
default = []
full = []

[lints]
workspace = true
