#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-workflow-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Static spec-documentation tool for the gandr component vocabulary: parse=validate, canonical XML formatting, and no-JavaScript HTML build (typst math/diagram leaves via the pinned CLI)"
license.workspace = true
publish.workspace = true

[lib]
name = "gandr_workflow_docs"
path = "src/lib.rs"

[[bin]]
name = "gandr-workflow-docs"
path = "src/main.rs"

[dependencies]
# Content-addressed cache keys for compiled math/diagram SVG leaves.
blake3 = { workspace = true }
# Read-only XML DOM for the parse=validate pass over the component corpus.
roxmltree = { workspace = true }
# Hayagriva `refs.yml` key set, read for cite-key resolution during validation.
yaml-rust2 = { workspace = true }

[features]
default = []
# House aggregating feature. The typst math/diagram compile path is a runtime
# shell-out to the pinned typst CLI (not a linked library), so no cargo feature
# is required to keep the regex family out of the default graph — the default
# graph never contains typst at all. `full` stays empty by the house scheme.
full = []

[lints]
workspace = true
