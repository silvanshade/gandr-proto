#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-workflow-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The gandr documentation tool: the prose document classes (parse-is-validate over XML), canonical XML formatting, and the shared bibliography machinery"
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "gandr_workflow_docs"
path = "src/lib.rs"

[[bin]]
name = "gandr-workflow-docs"
path = "src/main.rs"

[[test]]
name = "lib"
path = "tests/lib.rs"

[dependencies]
# Read-only XML DOM for the document-class parse=validate pass and the
# canonical formatter.
roxmltree = { workspace = true }
# Hayagriva bibliography key set, read for cite-key resolution during
# validation.
yaml-rust2 = { workspace = true }

[features]
default = []
# House aggregating feature (`full` stays empty by the house scheme).
full = []

[lints]
workspace = true
