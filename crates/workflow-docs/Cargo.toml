#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-workflow-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The gandr documentation tool: the GF-native spec pipeline (.gfd corpora as GF abstract-syntax trees, checkExpr validation, HTML by linearization), the prose document classes, canonical XML formatting, and the shared bibliography/typst machinery"
license.workspace = true
publish.workspace = true

[lib]
name = "gandr_workflow_docs"
path = "src/lib.rs"

[[bin]]
name = "gandr-workflow-docs"
path = "src/main.rs"

[dependencies]
# Content-addressed cache keys for compiled math/diagram SVG leaves.
blake3 = { workspace = true }
# The GF/PGF interop: the GfRuntime trait (internalization seam) and the B'
# .gfd s-expression surface.
gandr-workflow-grammatical-framework = { path = "../workflow-grammatical-framework" }
# Scoped code-payload escaping in the render post-pass.
regex = { workspace = true }
# Read-only XML DOM for the document-class parse=validate pass and the
# canonical formatter.
roxmltree = { workspace = true }
# Typed error derive for the crate error vocabulary.
thiserror = { workspace = true }
# UAX #29 sentence boundaries for the prose-pacing metrics lane.
unicode-segmentation = { workspace = true }
# Hayagriva `refs.yml` key set, read for cite-key resolution during validation.
yaml-rust2 = { workspace = true }

[features]
default = []
# House aggregating feature (`full` stays empty by the house scheme).
full = []

[lints]
workspace = true
