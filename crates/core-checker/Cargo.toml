#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-core-checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The recursive bidirectional type checker for the gandr CBPV core, with its subsumption and total-marking disciplines, its package and sealing judgements, and the kernel bridge"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "checker"
path = "tests/lib.rs"

[dependencies]
# The conversion engine subsumption decides its identity endpoints with, and the
# equational theory a solver certificate is re-checked against.
gandr-core-nbe.workspace = true
# The core CBPV term substrate every judgement here is stated over: syntax,
# types, contexts, substitution, interning, effect rows, grades, builtins, and
# the shared error, outcome, and wrapper vocabulary.
gandr-core-term.workspace = true
# The minimal certified kernel's S1 core (kernel-boundary.md §2). The B2.3
# bridge lowers checked core CBPV forms into the closed S1 vocabulary; this
# dependency direction is the permitted one — the section-2 TCB wall forbids the
# reverse (gandr-kernel-core depends on gandr-kernel-strata ONLY).
gandr-kernel-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The free generators this crate's own inline property tests build terms with.
# The edge points up a tier and is deliberate: `gandr-core-checker-tools`
# library-depends on this crate, so the pair carries a `[dev-dependencies]`
# cycle, which Cargo admits and which propagates to no consumer of either side.
gandr-core-checker-tools.workspace = true
# The level algebra, for tests that build a universe kind. `gandr-kernel-core`
# exposes `Level` through its public API (`ValueType::Universe`,
# `TermArena::value_type_universe`) without re-exporting it, so a caller naming
# one depends on the strata crate directly — the same posture the kernel's own
# test suite takes. The sealing rung needs it because an abstract type is
# declared AT a universe kind; the pass that flattens sealed modules into kernel
# declarations will need it as a regular dependency for the same reason.
gandr-kernel-strata.workspace = true
proptest.workspace = true

[features]
default = []
full = ["gandr_feat_regex"]
# Regex-backed builtins (`regex.extract`, `string.escape`), which live with the
# builtin registry in the substrate. Off by default.
gandr_feat_regex = ["gandr-core-term/gandr_feat_regex"]

[lints]
workspace = true
