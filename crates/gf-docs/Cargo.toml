#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-gf-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GF-native documentation pipeline (proof of concept, gandr-wrs): the corpus as GF abstract-syntax trees, validation via the PGF checkExpr lane, HTML by linearization"
license.workspace = true
publish.workspace = true

[lib]
name = "gandr_gf_docs"
path = "src/lib.rs"

[[bin]]
name = "gandr-gf-docs"
path = "src/main.rs"

[dependencies]
# The legacy XML pipeline, reused as the migration parser (XML -> model -> trees).
gandr-workflow-docs = { path = "../workflow-docs" }
# The GF/PGF interop: the GfRuntime trait (internalization seam) and the B'
# .gfd s-expression surface.
gandr-workflow-grammatical-framework = { path = "../workflow-grammatical-framework" }
# Scoped code-payload escaping in the render post-pass.
regex = { workspace = true }
# Typed error derive for the crate error vocabulary.
thiserror = { workspace = true }

[lints]
workspace = true
