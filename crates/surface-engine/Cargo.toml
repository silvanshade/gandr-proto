#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-surface-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Surface lowering engine: CST-to-core lowering, origin tracking, goals, incremental sessions, and kernel admission"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "engine"
path = "tests/lib.rs"

[dependencies]
gandr-core-checker.workspace = true
# The item-granular incremental typer: this crate's lowerings are its
# parser-agnostic `region::Item`s, `item_source` implements its seam, and the
# session-facing gate resumes through its checkpoint engine.
gandr-core-incremental.workspace = true
gandr-core-sequent.workspace = true
# The certified kernel this crate's session admits its S1-eligible definitions
# into, through `core-checker`'s elaborator-side bridge; the dependency points
# inward and the kernel never learns of this crate.
gandr-kernel-core.workspace = true
gandr-runtime-effects.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-parser.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-computads.workspace = true
gandr-theory-levitation.workspace = true
gandr-theory-nominal-automata.workspace = true
gandr-theory-recursion.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
gandr-core-checker = { workspace = true, features = ["gandr_test_strategies"] }
proptest.workspace = true

[features]
default = []
codecs = ["dep:serde", "dep:serde_json"]
full = ["codecs", "regex"]
regex = [
  "gandr-core-checker/gandr_feat_regex",
  "gandr-core-sequent/gandr_feat_regex",
]

[lints]
workspace = true
