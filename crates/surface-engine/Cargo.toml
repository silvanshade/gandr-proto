#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-surface-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Surface lowering engine: CST-to-core lowering, origin tracking, goals, incremental sessions, and kernel admission"
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "engine"
path = "tests/lib.rs"

[dependencies]
gandr-core-checker.workspace = true
# The item-granular incremental typer: this crate's lowerings are its
# parser-agnostic `region::Item`s, `item_source` implements its seam, and the
# session-facing gate resumes through its checkpoint engine.
gandr-core-incremental.workspace = true
# The typing machine the session drives and the diagnostic surface reads a
# failure state from.
gandr-core-machine.workspace = true
gandr-core-sequent.workspace = true
# The core CBPV term and type vocabulary lowering produces and the session
# carries, plus the host-effect seam foreign declarations are lowered onto.
gandr-core-term.workspace = true
# The certified kernel this crate's session admits its S1-eligible definitions
# into, through `core-checker`'s elaborator-side bridge; the dependency points
# inward and the kernel never learns of this crate.
gandr-kernel-core.workspace = true
gandr-runtime-effects.workspace = true
# The CAS tier the session exports its kernel environment through:
# `storage-artifact` mints the artifact and its manifest identity;
# `storage-prolly-trees` carries the block-store boundary and tree parameters
# the export signature exposes.
gandr-storage-artifact.workspace = true
gandr-storage-prolly-trees.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-parser.workspace = true
# The renderer-facing presentation vocabulary: the obligation class names and
# the obligation card the structured report and the render bus both project, so
# the report and the bus name the same eight classes instead of two mirrors of
# the parser taxonomy. Its codecs ride this crate's own `codecs` feature,
# because the report's wire image embeds them.
gandr-surface-render-remote.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-circuit-algebras.workspace = true
gandr-theory-coherent-resolutions.workspace = true
gandr-theory-computads.workspace = true
gandr-theory-levitation.workspace = true
gandr-theory-nominal-automata.workspace = true
gandr-theory-recursion.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# The free proptest generators over the core CBPV syntax and types. The checker
# itself is already a library dependency above; this dev entry adds only the
# generators, which live one tier up so the checker crate carries no test-only
# surface.
gandr-core-checker-tools.workspace = true
gandr-theory-cell-complexes.workspace = true
gandr-theory-coherent-resolutions.workspace = true
proptest.workspace = true

[features]
default = []
codecs = [
  "dep:serde",
  "dep:serde_json",
  "gandr-surface-render-remote/codecs",
]
full = ["codecs", "regex"]
regex = [
  "gandr-core-sequent/gandr_feat_regex",
  "gandr-core-term/gandr_feat_regex",
]

[lints]
workspace = true
