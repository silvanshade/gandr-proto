#:tombi toml-version = "v1.0.0"
#:schema https://raw.githubusercontent.com/crate-ci/typos/master/config.schema.json

[files]
# .agents/core/ = the vendored agentic-dev core (foreign tree, read-only, its own
# conventions); .claude/worktrees/ = in-repo agent worktrees. Both excluded per
# core/HAZARDS.md H13 (gitignoring is not scoping).
#
# *.typ: greenfield typst manual sources (Track C) quote Agda/math identifiers
# verbatim, so they get the same protection.
#
# docs/manual/refs.yml: bibliography citation
# keys and author names are identifiers, not prose; typos has already
# "corrected" the key aks-2015 → ask-2015 (the exact H8 failure mode,
# 2026-07-03, internal-univalence).
#
# vendor trees (vendor/** kept for
# any future root-level vendoring) are read-only upstream: a standalone typos
# run has already "corrected" upstream CHANGELOG spellings, dirtying the pin;
# scoped out so editor/CLI passes leave vendored trees untouched.
#
# PLAN.html: generated export of the approved wayfinder plan (gandr-fcw.14),
# carrying bibliography author names and register/tracker ids (Tye, FoPSS,
# gandr-8ot, …) — the bibliography class of identifier false positives. Mirrors
# the treefmt [formatter.typos]/[formatter.sizelint]/[formatter.oxfmt] excludes.
extend-exclude = [
  "PLAN.html",
  "secrets/",
  "treefmt.toml",
  ".agents/core/",
  ".claude/worktrees/",
  "*.typ",
  "docs/manual/refs.yml",
  # The corpus hayagriva bibliography was excluded here for the same reason as
  # docs/manual/refs.yml — citation keys and author names are identifiers, not
  # prose. It left the repository with the specification corpus, so the entry is
  # gone rather than stale.
  "vendor/**",
]

[default]
# Beads issue IDs (`gandr-<base36 suffix>`) are identifiers, not prose; their
# random 3-4 char suffixes trip typos on fragments (`gandr-8ot` -> "ot",
# `gandr-u7iz` -> "iz"). Ignore the whole token so present and future IDs are safe.
#
# Git commit hashes are all-hex tokens, not prose; short ones trip typos on
# fragments (a 7-char hash can contain "ba", "ef", ...). typos already auto-ignores
# long hashes; ignore 7+ hex tokens so short hashes are safe too.
extend-ignore-re = ['\bgandr-[0-9a-z]+\b', '\b[0-9a-f]{7,40}\b']

# Any word typos would "correct" into a WRONG word is pinned here as an identity
# mapping (word = "word"). STANDING RULE: an unwanted typos rewrite is fixed by
# growing THIS allowlist, never by rewording the prose around it — the intended
# vocabulary always wins. Covers mathematical vocabulary (typos has ALREADY
# tried hom→home and transfors→transforms — the H8 failure mode) AND ordinary-
# but-uncommon words (missable→miscible). Grow deliberately as terms enter the
# prose.
[default.extend-words]
Ket = "Ket"
ket = "ket"
Solum = "Solum"
solum = "solum"
# "mis" is the prose prefix in hyphenated forms like "mis-scope"; "Thm"/"thm"
# is the standard abbreviation for "Theorem" (e.g. "Thm 2.4"; typos rewrites it
# to "Them"). Neither is a typo.
mis = "mis"
Thm = "Thm"
thm = "thm"
# Used in the doc-gate scripts' "present but unparseable" error messages; a
# valid spelling typos would otherwise rewrite to "unparsable".
unparseable = "unparseable"
# Donald Yau — author of the PROPs monograph ("A Foundation for PROPs, Algebras,
# and Modules") and "Higher-Dimensional Algebra via Colored PROPs"; a surname,
# not a misspelling of "You"/"Yaw".
Yau = "Yau"
# Kosta Došen — co-author of "Weak Cat-Operads" and "Intermutation"; the ASCII
# transliteration of the surname is what bibliography citation keys carry, and
# typos reads it as a misspelling of "dozen"/"dose"/"doesn". The keys live in
# the (excluded) bibliography YAML, but the `[@key]` citations live in corpus
# prose, which typos does read.
dosen = "dosen"
Dosen = "Dosen"
# Rust TUI crate names (gandr-tui): typos rewrites "ratatui" to "ratatouille",
# which would corrupt prose, Cargo.toml, and use statements. "edtui" (editor
# widget) is protected pre-emptively for the same reason.
ratatui = "ratatui"
edtui = "edtui"
# Category-theory vocabulary in *.md math prose: typos rewrites "hom" to
# "home", corrupting "hom-set"/"hom-functor" (it has bitten committed prose
# before; H8-class fidelity hazard).
hom = "hom"
# "equipments" is the standard plural in formal category theory (proarrow
# equipments, virtual equipments); typos rewrites it to "equipment" (H8-class).
equipments = "equipments"
# "missable" is a real word; typos rewrites it to "miscible".
missable = "missable"
# "Nd"/"Nc" (= norm d / norm c) are the standard normalizer abbreviations in the
# UaBase canonicalization prose (canon-⊕ʳ, partA-⊕swap); typos rewrites
# "Nd" → "And".
nd = "nd"
# "transfor(s)" — the transformation-of-transformations vocabulary in the
# VDC/equipment prose; typos rewrites "transfors" → "transforms".
transfor = "transfor"
transfors = "transfors"
# "operad" is the standard name for the algebraic structure (operads, dioperads,
# properads, modular operads); typos rewrites it to "operand". This covers the
# Markdown prose.
operad = "operad"
Operad = "Operad"
# "substitude" — the Batanin–Kock–Weber structure (a monad in the bicategory of
# generalised species); typos rewrites "Substitudes" → "Substitutes".
substitude = "substitude"
Substitude = "Substitude"
substitudes = "substitudes"
Substitudes = "Substitudes"
# "corelation" — the categorical dual of a relation (a jointly-epic cospan);
# Fong's decorated-corelation construction and the Fong–Zanasi universal
# construction are both titled with it. typos rewrites it to "correlation", a
# different concept entirely, and it has already corrupted both prose and
# bibliography KEYS in this corpus (H8-class fidelity hazard).
corelation = "corelation"
Corelation = "Corelation"
corelations = "corelations"
Corelations = "Corelations"
# "explicits" — the plural in the modular-implicits/modular-explicits vocabulary
# (White–Bour–Yallop; Vivien–Rémy–Scherer, "On the Design and Implementation of
# Modular Explicits"); typos rewrites it to "explicit", which silently broke
# citation keys and prose in the elaborator-line documents (H8-class).
explicits = "explicits"
Explicits = "Explicits"
# "HoTTEST" — the Homotopy Type Theory Electronic Seminar Talks; typos reads
# it as a misspelling of TEST and rewrites the seminar name in prose.
HoTTEST = "HoTTEST"

[default.extend-identifiers]
CertiCoq = "CertiCoq"
# The upstream ET Book OpenType font family name (edwardtufte/et-book,
# et-book-ligatures-enabled set): typos case-splits it and flags the
# trailing "OT".
ETBookOT = "ETBookOT"
# Venue acronym in the bibliography: typos case-splits it and flags the
# leading "Fo".
FoSSaCS = "FoSSaCS"
serie = "serie"
shortcat = "shortcat"
