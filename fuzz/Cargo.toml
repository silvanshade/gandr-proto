#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

# The AFL++ fuzzing workspace. Independent of the main workspace on purpose:
# it carries its own lockfile, its own lint posture, and an instrumented build
# profile, and folding it in would put `afl` in the default dependency graph
# that `test:dep-graph` guards. The root manifest's `exclude` entry states the
# same choice from the other side.
#
# Every path dependency below names a reboot crate. The directory name and the
# package name differ throughout — `../crates/surface-engine` is the package
# `gandr-surface-engine` — so a path is never derivable from a package name.

[package]
name = "gandr-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# Total lowering on arbitrary bytes.
[[bin]]
bench = false
doc = false
name = "lower"
path = "fuzz_targets/lower.rs"
required-features = ["fuzzing"]
test = false

# The checker-versus-machine conformance property, under a nesting prefilter.
[[bin]]
bench = false
doc = false
name = "check"
path = "fuzz_targets/check.rs"
required-features = ["fuzzing"]
test = false

# The gate suite's bounded parser facade.
[[bin]]
bench = false
doc = false
name = "gates"
path = "fuzz_targets/gates.rs"
required-features = ["fuzzing", "gates"]
test = false

[dependencies]
afl = "0.18.2"
gandr-core-checker = { path = "../crates/core-checker" }
gandr-core-machine = { path = "../crates/core-machine" }
gandr-core-term = { path = "../crates/core-term" }
gandr-surface-engine = { path = "../crates/surface-engine" }
gandr-workflow-gates = { path = "../crates/workflow-gates", default-features = false, features = ["fuzzing"], optional = true }

[features]
fuzzing = []
gates = ["dep:gandr-workflow-gates"]
