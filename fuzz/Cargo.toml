#:schema https://www.schemastore.org/cargo.json
#:tombi toml-version = "v1.0.0"

[package]
name = "gandr-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
bench = false
doc = false
name = "lower"
path = "fuzz_targets/lower.rs"
required-features = ["fuzzing"]
test = false

[[bin]]
bench = false
doc = false
name = "parse"
path = "fuzz_targets/parse.rs"
required-features = ["fuzzing"]
test = false

[[bin]]
bench = false
doc = false
name = "check"
path = "fuzz_targets/check.rs"
required-features = ["fuzzing"]
test = false

# The E1/E2 differential-parity target (`wyrd-46lo`): the labeler token stream
# and the mold highlighter against tree-sitter, on arbitrary input. Behind the
# `parity` feature so the mold-side path deps are only pulled when it is built.
[[bin]]
bench = false
doc = false
name = "parity"
path = "fuzz_targets/parity.rs"
required-features = ["fuzzing", "parity"]
test = false

[[bin]]
bench = false
doc = false
name = "gates"
path = "fuzz_targets/gates.rs"
required-features = ["fuzzing", "gates"]
test = false

[dependencies]
afl.workspace = true
gandr-core = { path = "../crates/gandr-core" }
# The mold front-end the differential parity target checks against tree-sitter
# (internal path deps, `parity`-feature-only — no third-party dependency added).
gandr-grammar = { path = "../crates/gandr-grammar", optional = true }
gandr-parser = { path = "../crates/gandr-parser", optional = true }
gandr-pipeline = { path = "../crates/gandr-pipeline" }
gandr-render-proto = { path = "../crates/gandr-render-proto", default-features = false, optional = true }
gandr-syntax = { path = "../crates/gandr-syntax", optional = true }
gandr-tree-sitter = { path = "../crates/gandr-tree-sitter" }
tree-sitter.workspace = true
wyrd-rust-gates = { path = "../crates/wyrd-rust-gates", default-features = false, features = [
  "fuzzing"
], optional = true }

[features]
fuzzing = []
gates = ["dep:wyrd-rust-gates"]
parity = [
  "dep:gandr-grammar",
  "dep:gandr-parser",
  "dep:gandr-render-proto",
  "dep:gandr-syntax",
]
