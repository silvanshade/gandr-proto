#:tombi toml-version = "v1.0.0"
#:schema tombi://www.schemastore.org/cargo.json

[workspace]
resolver = "3"
members = [
  "crates/core-checker",
  "crates/core-sequent",
  "crates/kernel-core",
  "crates/kernel-strata",
  "crates/runtime-host",
  "crates/storage-chunker",
  "crates/storage-prolly-trees",
  "crates/surface-driver",
  "crates/theory-computads",
  "crates/theory-graphs",
  "crates/theory-levitation",
  "crates/theory-nominal-automata",
  "crates/theory-orders",
  "crates/theory-recursion",
  "crates/theory-virtual-doctrines",
  "crates/workflow-docs",
  "crates/workflow-dylint",
  "crates/workflow-gates",
]
# `fuzz/` is an independent AFL++ workspace with its own lockfile and lint
# posture (it also path-deps crates that have not been ported yet); keep it
# excluded from the main workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
readme = "README.md"
license = "Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
publish = false

[workspace.dependencies.afl]
version = "=0.18.2"
default-features = false

# Bao verified-streaming codec (BLAKE3 Merkle tree) — a storage-tier interop
# comparator exercised only by the prolly-trees contract suite.
# consumers:
# - gandr-storage-prolly-trees (dev)
[workspace.dependencies.bao]
version = "0.13.1"
default-features = false

# BLAKE3 hashing for content and manifest digests.
# consumers:
# - gandr-storage-prolly-trees (NodeHash = BLAKE3 node identity; snapshot/witness digests)
# - gandr-workflow-gates
# - gandr-workflow-docs (content-hash cache keys for compiled math/diagram SVG)
[workspace.dependencies.blake3]
version = "1.8.5"
default-features = false
features = ["std"]

[workspace.dependencies.cc]
version = "1.2.62"
default-features = false

# clippy's lint-authoring utility library (git-pinned to match the workspace
# nightly's rustc_private API).
# consumers:
# - gandr-workflow-dylint
[workspace.dependencies.clippy_utils]
git = "https://github.com/rust-lang/rust-clippy"
rev = "b2ae739f17134c08c1469989c105c752baf24c4f"

[workspace.dependencies.color-eyre]
version = "0.6.5"
default-features = false

# Benchmark harness.
# consumers:
# - gandr-workflow-gates (dev)
[workspace.dependencies.criterion]
version = "0.8.2"
default-features = false
features = ["cargo_bench_support"]

[workspace.dependencies.crossterm]
version = "0.29.0"
default-features = false
features = ["bracketed-paste"]

# Dylint lint-library authoring runtime.
# consumers:
# - gandr-workflow-dylint
[workspace.dependencies.dylint_linting]
version = "6.0.1"

# Dylint UI test harness (compiletest `.stderr` fixtures).
# consumers:
# - gandr-workflow-dylint (dev)
[workspace.dependencies.dylint_testing]
version = "6.0.1"

# Multiline editor widget (`gandr-tui`): the one maintained ratatui editor with
# an external span-injection API (`set_highlights`), which our highlighting
# requires. Default features are dropped to keep syntect (its built-in
# highlighter) and the clipboard stack out of the tree.
[workspace.dependencies.edtui]
version = "0.11.3"
default-features = false

[workspace.dependencies.fixedbitset]
version = "0.5.7"
default-features = false

# Snapshot assertion testing.
# consumers:
# - gandr-workflow-gates (dev)
[workspace.dependencies.insta]
version = "1.48.0"
default-features = false

# The interpreter FFI execution path (`gandr-ffi`, proposal-ffi.md §5.1). libffi
# builds a call frame from a runtime `ffi_type` description, so any extern
# signature is callable without per-function codegen; the pin matches the
# proposal. libffi-sys builds the bundled C libffi via `cc`.
[workspace.dependencies.libffi]
version = "5.1.1"
default-features = false

# Dynamic symbol resolution for the FFI handler (`gandr-ffi`): `dlopen`/`dlsym`
# over the platform loader, resolving each extern block's `from "lib"` target.
[workspace.dependencies.libloading]
version = "0.9.0"
default-features = false

# dtolnay `#[no_panic]`: a link-time proof that an annotated function cannot
# panic. Used on the grade leaf ops, gated at the use site on
# `all(not(debug_assertions), panic = "unwind")` — active in a dev release
# build, inert in debug (cannot prove) and under the dist abort profile. The
# macro is a no-op where the cfg is false, so it adds no codegen there.
# consumers:
# - gandr-core-checker
[workspace.dependencies.no-panic]
version = "0.1.36"

# Fuzzy ranking for the completion popup (`gandr-tui`): the helix-org matcher,
# matcher-only (no worker machinery — that is the full `nucleo` crate, deferred
# to the picker bead). Default features are load-bearing: the crate fails to
# compile without `unicode-casefold` (its enum `#[default]` markers are
# feature-gated). NOTE: MPL-2.0 (file-level copyleft).
[workspace.dependencies.nucleo-matcher]
version = "0.3.1"
default-features = false
features = ["unicode-casefold", "unicode-normalization"]

[workspace.dependencies.petgraph]
version = "0.8"
default-features = false
features = ["std"]

# PTY host for the terminal job pane. openpty + CommandBuilder spawn a child
# under a pseudo-terminal; the app owns a vt100 parser and renders it via
# tui-term.
[workspace.dependencies.portable-pty]
version = "0.9.0"
default-features = false

# Property-based testing framework.
# consumers:
# - gandr-workflow-gates (dev)
[workspace.dependencies.proptest]
version = "1.11.0"
default-features = true

# TUI framework.
[workspace.dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]

# Regex parsing for gandr regex builtins (`regex.extract`, `string.escape`).
# Keep defaults off; `std` avoids no-std spin locks, while `unicode-perl` keeps
# `\d`/`\w`/`\s` support available without the full Unicode feature bundle.
[workspace.dependencies.regex]
version = "1.12.4"
default-features = false
features = ["std", "unicode-perl"]

# Read-only XML DOM for the spec doc tool's parse=validate pass. Pure Rust
# (roxmltree -> xmlparser only; no regex family, no tree-sitter), so it stays
# clear of the forbidden-default-graph gate (crates/workflow-gates/src/project.rs).
# consumers:
# - gandr-workflow-docs
[workspace.dependencies.roxmltree]
version = "0.20.0"
default-features = false
features = ["std"]

# Serialization framework.
# consumers:
# - gandr-workflow-gates
[workspace.dependencies.serde]
version = "1.0.228"
default-features = false
features = ["derive", "std"]

# JSON codec for serde.
# consumers:
# - gandr-workflow-gates
[workspace.dependencies.serde_json]
version = "1.0.150"
default-features = false
features = ["std"]

# The lending-iterator trait tree-sitter's `QueryMatches`/`QueryCaptures`
# implement; needed as a direct dep to drive highlight queries (`gandr-tui`).
[workspace.dependencies.streaming-iterator]
version = "0.1.9"
default-features = false

# Rust token-stream parser for source analysis.
# consumers:
# - gandr-workflow-gates
[workspace.dependencies.syn]
version = "2.0"
default-features = false
features = ["full", "parsing", "visit"]

# Typed error derive (`thiserror::Error`) for crate error vocabularies.
# consumers:
# - gandr-core-checker
# - gandr-runtime-host
# - gandr-storage-prolly-trees
# - gandr-theory-orders
[workspace.dependencies.thiserror]
version = "2.0.18"
default-features = false

# TOML codec.
# consumers:
# - gandr-workflow-gates
[workspace.dependencies.toml]
version = "1.1.2"
default-features = false
features = ["display", "parse", "serde"]

# Terminal-emulator widget bridging our app-side vt100 screen to a ratatui
# widget: renders a `vt100::Screen` as a `PseudoTerminal`. Ratatui
# 0.30-compatible.
[workspace.dependencies.tui-term]
version = "0.3.0"
default-features = false
features = ["vt100"]

# Terminal (vt100) parser owned app-side by the PTY job pane: consumes child
# bytes into an addressable screen + scrollback that tui-term renders.
[workspace.dependencies.vt100]
version = "0.16.0"
default-features = false

# YAML codec (pure-Rust YAML 1.2).
# consumers:
# - gandr-workflow-gates
# - gandr-workflow-docs (reads the hayagriva refs.yml key set for cite resolution)
[workspace.dependencies.yaml-rust2]
version = "0.11.0"
default-features = false

[workspace.lints.clippy]
# all = { correctness, suspicious, style, complexity, perf }
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# nursery
missing_const_for_fn = "allow"
useless_let_if_seq = "allow"

# pedantic
too_many_lines = "allow"
uninlined_format_args = "allow"

# style
needless_raw_string_hashes = "allow"
needless_return = "allow"

# restriction
alloc_instead_of_core = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
as_pointer_underscore = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
decimal_literal_representation = "deny"
default_numeric_fallback = "deny"
default_union_representation = "deny"
deref_by_slicing = "deny"
disallowed_script_idents = "deny"
doc_include_without_cfg = "deny"
doc_paragraphs_missing_punctuation = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
exit = "deny"
expect_used = "deny"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
# inline_trait_bounds = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "deny"
missing_docs_in_private_items = "deny"
missing_inline_in_public_items = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
# module_name_repetitions = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
non_zero_suggestions = "deny"
panic = "deny"
pathbuf_init_then_push = "deny"
pattern_type_mismatch = "deny"
precedence_bits = "deny"
# print_stderr = "deny"
# print_stdout = "deny"
# pub_use = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
return_and_then = "deny"
same_name_method = "deny"
semicolon_outside_block = "deny"
shadow_same = "deny"
# shadow_unrelated = "deny"
# single_call_fn = "deny"
single_char_lifetime_names = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_self_imports = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
verbose_file_reads = "deny"

[workspace.lints.rust]
deprecated-safe = "deny"
future-incompatible = "deny"
keyword-idents = "deny"
let-underscore = "deny"
nonstandard-style = "deny"
refining-impl-trait = "deny"
rust-2018-compatibility = "deny"
rust-2018-idioms = "deny"
rust-2021-compatibility = "deny"
rust-2024-compatibility = "deny"
# Dylint drivers set `--cfg dylint_lib="<name>"`; crate code gates lint
# suppressions on it (the cfg_attr(dylint_lib = ...) sites), so the cfg
# name must be expected under every toolchain.
unexpected_cfgs = { level = "deny", priority = -1, check-cfg = [
  "cfg(dylint_lib, values(any()))"
] }
unknown-or-malformed-diagnostic-attributes = "deny"
unused = "deny"
warnings = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
# Module and item docs intentionally cross-link to private implementation items;
# docs are always built with `--document-private-items` (the `cargo:doc` task),
# so those targets resolve. Without this allow, the public-doc-links-to-private
# lint would reject the project's deliberate "link to the internals" doc style.
private_intra_doc_links = "allow"

[[workspace.metadata.dylint.libraries]]
git = "https://github.com/trailofbits/dylint"
rev = "ae6676727569eabeb7bd4b58773549b342511bad"
pattern = [
  "examples/general/abs_home_path",
  "examples/general/await_holding_span_guard",
  "examples/general/basic_dead_store",
  "examples/general/crate_wide_allow",
  "examples/general/incorrect_matches_operation",
  "examples/general/non_local_effect_before_unhandled_error",
  "examples/general/non_thread_safe_call_in_test",
  "examples/general/wrong_serialize_struct_arg",
  "examples/supplementary",
  "examples/restriction/assert_eq_arg_misordering",
  "examples/restriction/collapsible_unwrap",
  "examples/restriction/const_path_join",
  "examples/restriction/env_literal",
  "examples/restriction/inconsistent_qualification",
  "examples/restriction/misleading_variable_name",
  "examples/restriction/non_topologically_sorted_functions",
  "examples/restriction/question_mark_in_expression",
  "examples/restriction/ref_aware_redundant_closure_for_method_calls",
  "examples/restriction/register_lints_warn",
  "examples/restriction/suboptimal_pattern",
  "examples/restriction/try_io_result"
]

[[workspace.metadata.dylint.libraries]]
path = "crates/workflow-dylint"

# NOTE: `release` deliberately does NOT set `panic = "abort"` — it defaults to
# `unwind` so dtolnay `#[no_panic]` (which needs the unwind path) is active in a
# plain `cargo build --release`. The *real* release is `cargo build-dist`
# (`.cargo/config.dist.toml`), which sets `panic = "immediate-abort"` + build-std
# `optimize_for_size`; `[profile.dist]` below also pins `panic = "abort"` so the
# abort posture never depends on the `release` default.
[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1

[profile.dist]
inherits = "release"
panic = "abort"
