#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.7.5"

[settings]
activate_aggressive = true
experimental = true
env_shell_expand = true
minimum_release_age = "1d"
lockfile = true

[settings.cargo]
binstall = true

[settings.npm]
package_manager = "aube"

[env]
RUSTUP_TOOLCHAIN = "{{ get_env(name='RUSTUP_TOOLCHAIN', default='1.97.1') }}"
RUSTUP_TOOLCHAIN_NIGHTLY = "{{ get_env(name='RUSTUP_TOOLCHAIN_NIGHTLY', default='nightly-2026-05-28') }}"
_.path = ["{{ exec(command='dirname \"$(command -v rustup || echo \"$HOME/.cargo/bin/rustup\")\"') }}"]

[task_config]
includes = [".config/mise/tasks"]

[tools]
"aqua:anchore/grype" = "0.117.0"
"aqua:anchore/syft" = "1.51.0"
"cargo:adrs" = "0.11.0"
"cargo:b3sum" = "1.8.6"
"cargo:cargo-afl" = { version = "0.18.2", default-features = false }
"cargo:cargo-autoinherit" = "0.1.6"
"cargo:cargo-binstall" = "1.21.1"
"cargo:cargo-careful" = "0.4.10"
"cargo:cargo-dylint" = "6.0.4"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-nextest" = "0.9.143"
"cargo:coreutils" = "0.10.0"
"cargo:dylint-link" = "6.0.4"
"cargo:nu" = "0.113.1"  # NOTE: nu stays pinned at =0.113.1
"cargo:prek" = "0.4.13"
"cargo:rumdl" = "0.2.55"
"cargo:sizelint" = "0.1.5"
"cargo:typos-cli" = "1.49.0"
"cargo:worktrunk" = "0.74.0"
"github:numtide/treefmt" = "2.5.0"
"github:superradcompany/microsandbox" = { version = "0.6.8", matching_regex = "^microsandbox-" }
"github:tombi-toml/tombi" = "1.4.0"
"npm:@commitlint/cli" = "21.2.2"
"npm:oxfmt" = "0.63.0"
"npm:oxlint" = "1.78.0"
"npm:oxlint-tsgolint" = "7.0.2001"
"npm:tsdown" = "0.22.14"
aube = "1.40.0"
node = "26.7.0"
typst = "0.15.1"
