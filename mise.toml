cargo run --quiet -p gandr-workflow-gates -- mutants merge
"""

[tasks."mutants:merge"]
description = "Alias for the changed-code mutation campaign relative to main"
run = """
cargo run --quiet -p gandr-workflow-gates -- mutants merge
"""

[tasks."mutants:scheduled"]
description = "Run a changed-code mutation campaign over an explicit revision range, inside an ephemeral microVM"
usage = '''
flag "--from <from>" help="Base revision for the mutation range"
flag "--to <to>" help="Head revision for the mutation range"
'''
run = """
cargo run --quiet -p gandr-workflow-gates -- mutants scheduled --from "${usage_from?}" --to "${usage_to?}"
"""

[tasks."mutants:clean"]
description = "Stop and remove any microVM left behind by an interrupted mutants run"
# The Rust driver tears its sandbox down on both success and failure, but a
# SIGTERM to the driver can skip that. The sandbox's `--max-duration` eventually
# reaps it; this command reclaims the CPU and memory immediately.
run = """
cargo run --quiet -p gandr-workflow-gates -- mutants clean
"""

[tasks."mutants:sweep"]
description = "Schedule a comprehensive workspace mutation campaign in an ephemeral microVM (~2427 mutants; sets the baseline)"
run = """
cargo run --quiet -p gandr-workflow-gates -- mutants sweep
"""

# rustfmt.toml relies on nightly-only options (imports_granularity, wrap_comments,
# …), so fmt always runs under the pinned nightly — stable rustfmt silently
# ignores them and would format/check differently than treefmt's rustfmt.
[tasks."cargo:fmt"]
description = "Run cargo fmt"
run = """
RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN_NIGHTLY" cargo fmt --all
"""

[tasks."cargo:fmt-check"]
description = "Run cargo fmt in check mode (prek pre-commit hook)"
run = """
RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN_NIGHTLY" cargo fmt --all -- --check
"""

[tasks."cargo:nextest"]
description = "Run the workspace nextest suite"
run = """
# The Dylint driver is nightly-only (`#![feature(rustc_private)]`); the stable
# nextest lane excludes it — the nightly cargo:dylint/careful lanes cover it.
# Parked: the excluded tree-sitter reference-crate suite
# (`--manifest-path crates/tree-sitter/Cargo.toml`) returns with the
# tree-sitter lane.
cargo nextest run --workspace --exclude gandr-workflow-dylint --all-targets --features=full
"""

[tasks."cargo:careful-nextest"]
description = "Run workspace and excluded gandr-tree-sitter reference-crate nextest suites under cargo-careful"
run = """
RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN_NIGHTLY" cargo careful nextest run --workspace --all-targets --features=full
"""

[tasks."cargo:llvm-cov"]
description = "Generate coverage artifacts (lcov, human summary, and summary JSON) into coverage/"
run = """
mkdir -p coverage
cargo llvm-cov clean --workspace
cargo llvm-cov --no-report --workspace --all-targets --features=full
cargo llvm-cov report --lcov --output-path coverage/lcov.info
cargo llvm-cov report --summary-only | tee coverage/summary.txt
cargo llvm-cov report --json --summary-only --output-path coverage/llvm-cov-summary.json
"""

[tasks."coverage:check"]
description = "Generate coverage, verify the ratchet harness, then enforce per-file floors"
run = [
  { task = "cargo:llvm-cov" },
  { task = "test:coverage-ratchet" },
  # { task = "coverage:check:enforce" }
]

[tasks."coverage:check:enforce"]
description = "Fail when measured per-file coverage regresses below coverage/floors.toml"
run = """
cargo run --quiet -p gandr-workflow-gates -- coverage check --repo-root . --summary coverage/llvm-cov-summary.json --floors coverage/floors.toml
"""

[tasks."coverage:ratchet"]
description = "Manually raise per-file coverage floors to the current measured coverage"
depends = ["cargo:llvm-cov"]
run = """
cargo run --quiet -p gandr-workflow-gates -- coverage ratchet --repo-root . --summary coverage/llvm-cov-summary.json --floors coverage/floors.toml
"""

# AFL++ fuzzing over the gandr crates. The `fuzz/` package is an independent
# workspace; every campaign is single-process and runs sequentially.
[tasks."fuzz:lower"]
description = "Fuzz the CST -> core lowerer (lower_source_total totality) with AFL++"
run = """
cargo afl build --manifest-path fuzz/Cargo.toml --bin lower
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -i fuzz/corpus/lower -o fuzz/artifacts/lower fuzz/target/debug/lower
"""

[tasks."fuzz:parse"]
description = "Fuzz the tree-sitter parser bridge with AFL++"
run = """
cargo afl build --manifest-path fuzz/Cargo.toml --bin parse
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -i fuzz/corpus/parse -o fuzz/artifacts/parse fuzz/target/debug/parse
"""

[tasks."fuzz:check"]
description = "Fuzz lower -> checker/machine (no panic + checker == machine) with AFL++"
run = """
cargo afl build --manifest-path fuzz/Cargo.toml --bin check
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -i fuzz/corpus/check -o fuzz/artifacts/check fuzz/target/debug/check
"""

[tasks."fuzz:parity"]
description = "Fuzz parser and highlighting parity with AFL++"
run = """
cargo afl build --manifest-path fuzz/Cargo.toml --features parity --bin parity
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -i fuzz/corpus/parity -o fuzz/artifacts/parity fuzz/target/debug/parity
"""

[tasks."fuzz:gates"]
description = "Fuzz the unified Rust gate suite with AFL++"
run = """
cargo afl build --manifest-path fuzz/Cargo.toml --features gates --bin gates
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -i fuzz/corpus/gates -o fuzz/artifacts/gates fuzz/target/debug/gates
"""

[tasks."fuzz:rust-smoke"]
description = "Deterministically replay every Rust fuzz corpus seed once"
run = """
cargo run --quiet -p gandr-workflow-gates -- fuzz-smoke
"""

[tasks."fuzz:weekly"]
description = "Run bounded 300-second AFL++ campaigns across all five Rust targets sequentially"
run = """
cargo afl build --manifest-path fuzz/Cargo.toml --bin lower
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -V 300 -i fuzz/corpus/lower -o fuzz/artifacts/lower fuzz/target/debug/lower
cargo afl build --manifest-path fuzz/Cargo.toml --bin parse
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -V 300 -i fuzz/corpus/parse -o fuzz/artifacts/parse fuzz/target/debug/parse
cargo afl build --manifest-path fuzz/Cargo.toml --bin check
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -V 300 -i fuzz/corpus/check -o fuzz/artifacts/check fuzz/target/debug/check
cargo afl build --manifest-path fuzz/Cargo.toml --features parity --bin parity
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -V 300 -i fuzz/corpus/parity -o fuzz/artifacts/parity fuzz/target/debug/parity
cargo afl build --manifest-path fuzz/Cargo.toml --features gates --bin gates
AFL_NO_UI=1 AFL_AUTORESUME=1 cargo afl fuzz -V 300 -i fuzz/corpus/gates -o fuzz/artifacts/gates fuzz/target/debug/gates
"""

[tasks."maintenance:weekly"]
description = "Run the bounded weekly fuzz and changed-code mutation campaigns sequentially"
usage = '''
flag "--from <from>" help="Base revision for the mutation range"
flag "--to <to>" help="Head revision for the mutation range"
'''
run = [
  { task = "fuzz:weekly" },
  { task = "mutants:scheduled", args = [
    "--from",
    "{{usage.from}}",
    "--to",
    "{{usage.to}}"
  ] }
]

[tasks."maintenance:advance"]
description = "Atomically advance the successful weekly campaign watermark"
usage = '''
flag "--watermark <watermark>" help="Runner-local watermark path"
flag "--to <to>" help="Successful upper revision" default="HEAD"
'''
run = 'cargo run --quiet -p gandr-workflow-gates -- maintenance-range advance --watermark "{{usage.watermark}}" --to "{{usage.to}}"'

[tasks."maintenance:monthly"]
description = "Run the monthly full contained mutation sweep"
run = [{ task = "mutants:sweep" }]

# no_panic link smoke: prove Grade::{leq,plus,times} panic-free. A plain release
# build (panic = "unwind" by default) links the annotated ops via the example, so
# no_panic's link-time check fires; the dev release is unwind precisely so this
# needs no extra flags. (#[no_panic] needs the unwind path — dist's abort would
# defeat it — so the use-site cfg is `all(not(debug_assertions), panic = "unwind")`.)
[tasks."cargo:no-panic"]
description = "Release no_panic link smoke (Grade leaf ops)"
run = """
cargo build --release -p gandr-core --example no_panic_smoke
"""

[tasks."cargo:miri"]
description = "Run the workspace test suite under Miri"
run = """
RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN_NIGHTLY" cargo miri test --workspace --all-targets --features=full
"""

[tasks.treefmt]
description = "Run treefmt"
run = """
RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN_NIGHTLY" treefmt
"""

[tasks."treefmt:check"]
description = "Run treefmt in CI mode"
run = """
RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN_NIGHTLY" treefmt --ci
"""

[tasks."test:coverage-ratchet"]
description = "Verify per-file coverage floors, monotonicity, schema validation, and path boundaries"
run = """
cargo nextest run -p gandr-workflow-gates
"""

[tasks."test:gate-parity"]
description = "Verify scheduled tasks and local hooks share exact self-contained gate definitions"
run = """
cargo nextest run -p gandr-workflow-gates
"""

# Parked gate entries, restored with the pieces they check: toolchain:pin-check
# returns when the fcw.13 toolchain pin gate is rebuilt; grammar:test returns
# with the surface-grammar port (see the parked task above).
[tasks."gate:merge"]
description = "Run the native pre-merge gate"
run = [
  { task = "cargo:build" },
  { task = "cargo:clippy" },
  { task = "cargo:nextest" },
  { task = "treefmt:check" }
]

# ── Agda metatheory (metatheory/; ADR-30 — Agda is the sole proof vehicle) ──────
# Agda 2.8.0 (pinned above) + agda-stdlib v2.4 (verified under 2.8.0), vendored by
# `agda:deps`. Adding an Agda dependency is vetted first — see docs/WORKFLOW.md
# "External research artifacts and dependency discipline".
# The IU engine (Internal.Graph / Internal.Rewriting[.Confluence] / Internal.Prelude)
# is consumed from the pinned submodule metatheory/upstream/internal-univalence,
# included on both gate lines via `-i …/internal-univalence/src` (pin gate: iu:check;
# provenance: metatheory/README.md "Upstream integration").
#
# Strict root / holey leaf (docs/WORKFLOW.md "Agda house style"): the first
# `agda:check` line gates the strict root (Gandr.Everything, 0 diagnostics);
# each DECLARED holey leaf — a module the root does not import, carrying the
# R3 in-progress proof obligations as interaction holes — gets its own line
# with `--expected-code UnsolvedInteractionMetas`, so exactly the declared
# holes are tolerated and anything else still fails. Current leaves:
#   * metatheory/src/Gandr/Prop/Obligations.agda (canonicity
#     existence/uniqueness + decidable equality on canonical forms). Keeps
#     full OPTIONS (--safe coexists with interaction holes), so it needs NO
#     exemption in the unified Rust OPTIONS-policy gate.

[tasks."agda:deps"]
description = "Vendor the Agda dependencies (agda-stdlib v2.4) via the gandr driver's script runner"
run = """
cargo run -q -p gandr -- scripts/agda-deps.gandr
"""

[tasks."agda:check"]
description = "Type-check the gandr Agda metatheory under Agda 2.8.0 (strict root + declared holey leaf via aifix + OPTIONS policy sweep)"
depends = ["agda:deps"]
run = """
aifix batch agda --fail-on-diagnostics -- -v0 -i metatheory/src -i metatheory/upstream/internal-univalence/src -i metatheory/vendor/agda-stdlib/src --warning=noUnsupportedIndexedMatch metatheory/src/Gandr/Everything.agda
aifix batch agda --fail-on-diagnostics --expected-code UnsolvedInteractionMetas -- -v0 -i metatheory/src -i metatheory/upstream/internal-univalence/src -i metatheory/vendor/agda-stdlib/src --warning=noUnsupportedIndexedMatch metatheory/src/Gandr/Prop/Obligations.agda
cargo run --quiet -p gandr-workflow-gates -- options-policy --workspace-root .
"""

[tool_alias]
weave-cli = "github:ataraxy-labs/weave"
weave-mcp = "github:ataraxy-labs/weave"

[tools]
"aqua:anchore/grype" = "0.116.0"
"aqua:anchore/syft" = "1.48.0"
"cargo:adrs" = "0.10.0"
"cargo:b3sum" = "1.8.5"
"cargo:cargo-autoinherit" = "0.1.6"
"cargo:cargo-binstall" = "1.21.0"
"cargo:cargo-careful" = "0.4.10"
# cargo-afl's release binary embeds its build host's cargo registry path, which
# makes `cargo afl config --build` non-relocatable. This no-op feature override
# forces mise's Cargo backend to source-build this one tool instead of binstall.
"cargo:cargo-afl" = { version = "0.18.2", default-features = false }
"cargo:cargo-dylint" = "6.0.1"
"cargo:dylint-link" = "6.0.1"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-nextest" = "0.9.140"
# uutils coreutils — monolithic multicall binary, invoked `coreutils cp`.
# Gives uniform reflink copy (`coreutils cp --reflink=auto`) on macOS AND Linux
# for any local CI cache artifact warmup/copying.
"cargo:coreutils" = "0.9.0"
"cargo:mergiraf" = "0.18.0"
"cargo:nu" = "0.113.1"  # NOTE: nu stays pinned at =0.113.1
"cargo:prek" = "0.4.10"
"cargo:rumdl" = "0.2.34"
"cargo:sizelint" = "0.1.5"
"cargo:typos-cli" = "1.48.0"
"cargo:uv" = "0.11.29"
"cargo:worktrunk" = "0.68.0"
"github:agda/agda" = "2.8.0"
"github:bytecodealliance/wit-bindgen" = "0.59.0"
"github:Dicklesworthstone/beads_viewer" = "0.18.0"
"github:numtide/treefmt" = "2.5.0"
# microsandbox (`msb`): libkrun microVM runner, the containment substrate for
# cargo-mutants. The regex is load-bearing and ANCHORED: it
# selects the BUNDLE `microsandbox-<os>-<arch>.tar.gz`, which carries both `msb` and
# the `libkrunfw.5.dylib` kernel payload that `msb` dlopens at VM boot. The bare
# `msb-*` asset installs cleanly and then fails on first boot; unanchored,
# `microsandbox-` also matches `libmicrosandbox_go_ffi-*`. mise extracts the bundle
# flat, and `msb` resolves libkrunfw "beside the resolved msb binary", so no
# MSB_LIBKRUNFW_PATH is needed. macOS support is Apple Silicon only.
"github:superradcompany/microsandbox" = { version = "0.6.6", matching_regex = "^microsandbox-" }
"github:tombi-toml/tombi" = "1.2.1"
"npm:@commitlint/cli" = "21.2.1"
"npm:oxfmt" = "0.59.0"
"npm:oxlint" = "1.74.0"
"npm:oxlint-tsgolint" = "0.25.0"
"npm:tsdown" = "0.22.9"
"pipx:yamllint" = "1.38.0"
aube = "1.29.1"
node = "26.5.0"
typst = "0.15.1"
weave-cli = { version = "v0.3.6", matching = "weave-cli", rename_exe = "weave" }
weave-mcp = { version = "v0.3.6", matching = "weave-mcp", rename_exe = "weave-mcp" }
