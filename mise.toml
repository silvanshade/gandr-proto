#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise.json

# Linked-worktree trust propagation replaces lifecycle trust hooks (core H15).
# Snapshot harness roots belong in the user's global `trusted_config_paths`;
# a project config cannot bootstrap trust for its own isolated copy.
min_version = "2026.7.5"

[settings]
activate_aggressive = true
experimental = true
env_shell_expand = true
minimum_release_age = "1d"
lockfile = true

[settings.npm]
package_manager = "aube"

[settings.pipx]
uvx = true

[settings.cargo]
# Fetch prebuilt release binaries via cargo-binstall instead of compiling
# cargo: tools (including coreutils) from source. `cargo:cargo-binstall` is
# pinned in [tools], so this holds in fresh/isolated environments too.
binstall = true

[env]
# Toolchain pins are configured ONCE here — mise is the SOLE toolchain
# authority. A rust-toolchain.toml would be a second copy of the same pin that
# RUSTUP_TOOLCHAIN shadows inside every task, and two copies drifted in
# practice (the repo template shipped mismatched pins and the stale one won).
# `get_env` keeps the ambient value when a caller already set it, so an
# explicit override wins.
# RUSTUP_TOOLCHAIN preempts even an explicit `rustup run <other>` argument, so
# nightly tasks re-export it inline (`RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN_NIGHTLY" …`)
# rather than fighting that precedence with `rustup run`.
RUSTUP_TOOLCHAIN = "{{ get_env(name='RUSTUP_TOOLCHAIN', default='1.97.1') }}"
RUSTUP_TOOLCHAIN_NIGHTLY = "{{ get_env(name='RUSTUP_TOOLCHAIN_NIGHTLY', default='nightly-2026-07-07') }}"
# Cargo resolves external subcommand binaries (cargo-clippy, cargo-fmt,
# rustfmt) from PATH, so a Homebrew rust install at /opt/homebrew/bin silently
# shadows the pinned toolchain. Prepend the rustup PROXY directory (not a
# resolved toolchain bin dir): the proxies dispatch on RUSTUP_TOOLCHAIN, so
# every task — and every child a formatter spawns — follows the pin above or a
# task's inline nightly override.
_.path = [
  "{{ exec(command='dirname \"$(command -v rustup || echo \"$HOME/.cargo/bin/rustup\")\"') }}"
]

[tasks."dev:enable"]
description = "Enable local mise development hooks"
run = """
echo 'env = ["dev"]' > .miserc.toml
echo "mise development config enabled"
"""

[tasks."dev:disable"]
description = "Disable local mise development hooks"
run = """
rm -f .miserc.toml
echo "mise development config disabled"
"""

[tasks.setup]
description = "Populate fresh-worktree dependencies (root devDependencies for the treefmt/oxlint and commitlint hooks + the pinned Rust toolchains and components)"
run = """
aube ci
rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
rustup toolchain install "$RUSTUP_TOOLCHAIN_NIGHTLY" --profile minimal --component clippy,rustfmt,rust-src,llvm-tools-preview,rustc-dev
"""

# Parked: the tree-sitter grammar package is not in the repo yet (it returns
# with the surface-grammar port); restore this task — and its gate:merge
# entry — with it.
# [tasks."grammar:test"]
# description = "Tree-sitter grammar suite + §7-G3 gates (corpus, coverage, recovery locality, parser.c size / STATE_COUNT budgets, zero conflicts/prec.dynamic/scanner)"
# run = """
# aube test --dir packages/tree-sitter-gandr
# aube run fuzz:smoke --dir packages/tree-sitter-gandr
# aube run parse:fuzz-seeds --dir packages/tree-sitter-gandr
