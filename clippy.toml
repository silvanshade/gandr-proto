#:tombi toml-version = "v1.0.0"

# Transitive version splits we cannot unify (they enter the graph only under the
# dev/`proptest-strategies` feature, via proptest's rand chain): `getrandom`
# 0.3/0.4 and its UEFI backend `r-efi` 5/6. `hashbrown` 0.16/0.17 is the same
# situation in `gandr-data`: `yaml-rust2 → hashlink` pins `hashbrown` 0.16 while
# `serde_json → indexmap` uses 0.17. `petgraph` 0.8's live `hashbrown` 0.15
# chain pins `foldhash` 0.1, while those 0.16/0.17 chains use `foldhash` 0.2;
# no compatible release unifies either split.
# `multiple_crate_versions` (clippy `cargo` group, denied) is otherwise kept
# active for duplicates we own.
#
# The `gandr-tui` block (bit-set/bit-vec/bitflags/rand/rand_core/syn/thiserror):
# these old versions enter the LOCKFILE only through ratatui's optional termwiz
# backend (`ratatui-termwiz → termwiz → fancy-regex + wezterm-*`), which the
# workspace never activates — the lint reads lock metadata, not the activated
# graph. The modern versions are the live ones (proptest's rand chain, our
# thiserror 2, syn 2).
#
# `nix`/`cfg_aliases`: the `gandr-tui` PTY host pulls `portable-pty 0.9 → nix
# 0.28` (whose build script uses `cfg_aliases 0.1`), while the live tree
# elsewhere is on `nix 0.29` / `cfg_aliases 0.2` (crossterm's signal-hook-mio
# chain). `portable-pty 0.9` is the current release and has not moved to `nix
# 0.29`; nothing we own can unify these, and the split is confined to the pty
# backend (a build-time transitive for `cfg_aliases`).
#
# The `reedline` block (itertools/strum/strum_macros/vte): the `gandr` driver's
# accepted line editor (ADR-74 D6) pins `itertools 0.13`, `strum 0.27` /
# `strum_macros 0.27`, and (via `strip-ansi-escapes`) `vte 0.14`, while the
# `gandr-tui` `ratatui` chain is on `itertools 0.14` / `strum 0.28` and the
# `vt100` PTY parser on `vte 0.15`. `reedline 0.49` is the current release and
# has not moved to those majors; nothing we own can unify these splits, and they
# are confined to the driver crate's editor and the TUI's rendering backends.
allowed-duplicate-crates = [
  "bit-set",
  "bit-vec",
  "bitflags",
  "cfg_aliases",
  "foldhash",
  "getrandom",
  "hashbrown",
  "itertools",
  "nix",
  "r-efi",
  "rand",
  "rand_core",
  "strum",
  "strum_macros",
  "syn",
  "thiserror",
  "thiserror-impl",
  "vte",
  "windows-sys",
]
