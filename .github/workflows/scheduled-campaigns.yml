name: Scheduled campaigns

"on":
  schedule:
    - cron: "17 3 * * 1"
    - cron: "29 4 1 * *"
  repository_dispatch:
    types:
      - weekly-maintenance
      - monthly-maintenance

permissions:
  contents: read

concurrency:
  group: scheduled-campaigns
  cancel-in-progress: false

env:
  MISE_ENABLE_TOOLS: "cargo:cargo-afl,github:superradcompany/microsandbox"

jobs:
  weekly:
    name: Weekly bounded fuzz and changed-code mutation campaign
    timeout-minutes: 90
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 1') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'weekly-maintenance')
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - wyrd-maintenance
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize public core submodule
        run: |
          if [ ! -f .agents/core/core/WORKFLOW.md ]; then
            git submodule update --init --depth 1 -- .agents/core
          fi
      - name: Install pinned campaign tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: true
          experimental: true
      - name: Resolve the weekly commit range
        id: range
        env:
          WEEKLY_FROM: ${{ github.event.client_payload.from || '' }}
        run: cargo run --quiet -p wyrd-rust-gates -- maintenance-range --github-output "$GITHUB_OUTPUT" --from "$WEEKLY_FROM" --watermark "$HOME/.cache/wyrd/weekly-success.json"
      - name: Run the weekly maintenance entrypoint
        env:
          WEEKLY_BASE: ${{ steps.range.outputs.base }}
        run: mise run maintenance:weekly --from "$WEEKLY_BASE" --to HEAD
      - name: Clean stray mutation sandboxes
        if: always()
        run: mise run mutants:clean
      - name: Upload weekly campaign reports and crashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: weekly-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutants.out/
            mutants.out.next/
            mutants.out.previous/
            fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 90
      - name: Record the fully successful weekly upper bound
        run: mise run maintenance:advance --watermark "$HOME/.cache/wyrd/weekly-success.json" --to HEAD

  monthly:
    name: Monthly full mutation campaign
    timeout-minutes: 540
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '29 4 1 * *') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'monthly-maintenance')
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - wyrd-maintenance
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize public core submodule
        run: |
          if [ ! -f .agents/core/core/WORKFLOW.md ]; then
            git submodule update --init --depth 1 -- .agents/core
          fi
      - name: Install pinned campaign tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: true
          experimental: true
      - name: Run the monthly maintenance entrypoint
        run: mise run maintenance:monthly
      - name: Clean stray mutation sandboxes
        if: always()
        run: mise run mutants:clean
      - name: Upload monthly campaign reports and crashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monthly-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutants.out/
            mutants.out.next/
            mutants.out.previous/
            fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 90
