#:tombi toml-version = "v1.0.0"

# worktrunk project-config base fragment delta (agentic-dev core).
#
# NOTE: worktrunk honors [merge] and [remove] ONLY in user config
# (~/.config/worktrunk/config.toml), NOT at project scope — so the default
# `wt merge` SQUASHES. Pass `wt merge --no-squash` per invocation, or set
# `[merge] squash = false` once in the user config (core/WORKFLOW.md
# §"Worktrees and merging").
#
# Adding/changing a hook re-prompts worktrunk's approval: run
# `wt config approvals add` once after wiring — never blanket `--yes`.
#
# Hook interactivity audit: lifecycle commands are non-interactive by
# construction. Mise trust and ignored-state copying do not live here; mise
# v2026.7.5+ propagates trust from the main checkout, and the opt-in
# `mise.dev.toml` shell hooks own fail-open `wt step copy-ignored` (core H15).

# Pre-start is intentionally minimal while the gandr reboot bootstraps: the
# remaining template steps (mise setup, submodule init/warmup) reference state
# this repo does not have yet and are re-grown alongside the pieces they serve
# (toolchain gates, metatheory mount).

[[pre-start]]
copy-ignored = "wt step copy-ignored"

# The tracker's Dolt clone is private working state, not shareable source:
# keep every newborn worktree's .beads out of group/other reach.
[[pre-start]]
beads-chmod = "chmod 0700 .beads"

# Freshness gate (docs/HAZARDS.md H2): pull the newborn worktree's tracker
# clone from the remote (the only synced copy). Best-effort (`|| true`) so an
# offline/transient pull never blocks creation; linked-worktree trust already
# propagates from the main checkout before this hook runs (core H15).
[[pre-start]]
beads-pull = "bd dolt pull || true"

# Native local CI — the project-scope gate for `wt merge` (hooks run by default
# after the rebase, before the fast-forward) and on demand via
# `wt hook pre-merge`. Each one-key pipeline block runs after the previous one
# succeeds, so local policy, validation, and durability work never overlap.
#
# Reject ADR-log edits before spending time on the native gate
# (core/HAZARDS.md H5): ADRs land only on main.
[[pre-merge]]
adr-guard = "nu .agents/core/scripts/check-adr-on-main.nu --adr-path docs/adr"

# Enforce read-only + pin discipline for the vendored agentic-dev core (ADR-2).
[[pre-merge]]
core-pin = "mise run core:check"

# `gate:merge` is the single source of truth for merge checks. It runs the
# grammar suite, build, lint wall, tests, formatting check, and workflow
# validation in order. Heavier checks (docs/graph gates, no-panic,
# cargo-careful, llvm-cov) remain push tier.
[[pre-merge]]
gate-merge = "mise run gate:merge"

# Make this branch's beads durable on DoltHub only after every validation gate
# is green (docs/HAZARDS.md H2). Pull-then-push self-heals the non-fast-forward
# race between independent per-worktree Dolt clones; a genuine row conflict
# still aborts the merge.
[[pre-merge]]
beads = "bd dolt pull && bd dolt push"

# Freshness gate (docs/HAZARDS.md H2, read side). The [pre-merge] `beads` gate pushes the
# branch's beads to DoltHub just before the worktree is removed — but the PRIMARY (main)
# checkout's own Dolt clone does not auto-pull them, so `main` reads stale until someone
# pulls by hand (the 2026-06-28 missing-seam incident). `post-merge` runs in the primary
# worktree after the merge (the branch worktree is gone), so this re-syncs main's local
# clone with what the merge just made durable. Background + logged (post-* never blocks).
[post-merge]
beads-pull = "bd dolt pull"

# Structural guard for H11 (defense in depth beneath `export.auto: false`): exclude the
# passive beads jsonl exports from the "wt step copy-ignored" reflink above, so a stale
# branch-birth snapshot is never copied into a new worktree to be auto-imported at the
# pre-merge beads gate (core/HAZARDS.md H11).
[step.copy-ignored]
exclude = [
  ".beads/*.jsonl",
  "target/**",
  "crates/gandr-tree-sitter/target/**",
  "fuzz/target/**",
  "fuzz/artifacts/**",
  "coverage/**",
  "packages/tree-sitter-gandr/node_modules/**",
]
