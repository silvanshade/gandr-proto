#:tombi toml-version = "v1.0.0"

# worktrunk project-config base fragment delta (agentic-dev core).
#
# NOTE: worktrunk honors [merge] and [remove] ONLY in user config
# (~/.config/worktrunk/config.toml), NOT at project scope — so the default
# `wt merge` SQUASHES. Pass `wt merge --no-squash` per invocation, or set
# `[merge] squash = false` once in the user config
# (docs/workflow/worktrees.md §"Hooks (`.config/wt.toml`)").
#
# Adding/changing a hook re-prompts worktrunk's approval: run
# `wt config approvals add` once after wiring — never blanket `--yes`.
#
# Hook interactivity audit: lifecycle commands are non-interactive by
# construction. Mise trust does not live here; mise v2026.7.5+ propagates
# trust from the main checkout, so no hook needs to bootstrap it.

# Pre-start is intentionally minimal while the gandr reboot bootstraps: the
# remaining template steps (mise setup, submodule init/warmup) reference state
# this repo does not have yet and are re-grown alongside the pieces they serve
# (toolchain gates).

[[pre-start]]
copy-ignored = "wt step copy-ignored"

# Freshness gate: pull the machine's SHARED beads database (one Dolt database
# per machine, resolved through the git common directory — worktrees carry no
# database state of their own) from DoltHub. Guards cross-MACHINE staleness;
# worktree-to-worktree visibility is immediate. Best-effort (`|| true`) so an
# offline/transient pull never blocks creation (gandr-fid.15).
[[pre-start]]
beads-pull = "bd dolt pull || true"

# Native local CI — the project-scope gate for `wt merge` (hooks run by default
# after the rebase, before the fast-forward) and on demand via
# `wt hook pre-merge`. Each one-key pipeline block runs after the previous one
# succeeds, so local policy, validation, and durability work never overlap.
#
# Parked while the reboot bootstraps: the ADR guard's script lives in the
# unwired agentic-dev core and docs/adr does not exist yet; core-pin checks the
# vendored core that is likewise not wired. Re-enable with their prerequisites.
# [[pre-merge]]
# adr-guard = "nu .agents/core/scripts/check-adr-on-main.nu --adr-path docs/adr"
#
# [[pre-merge]]
# core-pin = "mise run core:check"

# `gate:merge` is the single source of truth for merge checks. It runs the
# toolchain pin check, the docs conflict, drift, and reference gates, build,
# the lint wall, rustdoc, tests, and the formatting check in order; the body in
# .config/mise/tasks/mise-tasks-gates.toml owns the membership, so this
# comment names the shape and never the list. Heavier checks (the doc, page,
# graph, and oracle gates, no-panic, cargo-careful, and the upstream Dylint
# inventory) remain push tier; coverage enforcement is off both tiers while
# the per-file floors are unseeded.
[[pre-merge]]
gate-merge = "mise run gate:merge"

# Make this branch's beads durable on DoltHub only after every validation gate
# is green. Pull-then-push self-heals the non-fast-forward race with other
# pushers (other machines, or a not-yet-migrated stale clone); a genuine row
# conflict still aborts the merge (gandr-fid.15).
[[pre-merge]]
beads = "bd dolt pull && bd dolt push"

# Freshness gate, read side. With the shared per-machine database the branch's
# beads are already visible in the primary the moment they are written; this
# post-merge pull now only re-syncs against DoltHub for cross-machine changes.
# Background + logged (post-* never blocks). (gandr-fid.15)
[post-merge]
beads-pull = "bd dolt pull"

# EVERY directory below is listed TWICE, and that is the whole point of this
# block's shape. `wt step copy-ignored` matches these patterns against GIT's
# ignored-entry enumeration, which returns a wholly-ignored directory as one
# collapsed entry with no trailing slash, and a directory git was forced to
# descend into (a negation, or patterns naming only children) as the entries
# inside it. The two pattern forms are NOT interchangeable — measured against
# wt v0.71.0, 2026-08-08:
#
#   <dir>/    matches the collapsed entry "<dir>", and nothing under it
#   <dir>/**  matches entries under "<dir>", and not "<dir>" itself
#
# The two shapes are not even mutually exclusive: a directory ignored by a
# nested .gitignore of its own comes back as BOTH the collapsed entry and its
# children in one enumeration (measured 2026-08-10 on a cache directory that
# ships such a file), so a single form leaves half the entries copied.
#
# Writing one form, chosen from how .gitignore happens to cover that directory
# today, is the bug this list repairs (gandr-vibl): the exclusion becomes a
# silent no-op when the enumeration comes back in the other shape, and it fails
# in the direction of copying MORE. Nothing reports it. The doubled form is
# correct under either shape, so an unrelated .gitignore edit can no longer
# switch an exclusion off — which matters most for .beads, below.
#
#   .beads/  —  the correctness-critical entry (gandr-fid.15). Worktrees must
#     NOT carry gitignored .beads state: bd shares ONE database per machine via
#     git common-directory discovery, and a copied .beads (Dolt data snapshot,
#     stale dolt-server port/pid files) shadows that discovery and forks
#     per-worktree clones — the 2026-07-22 double-recording incident. It also
#     subsumes the older guard against copying stale passive jsonl exports.
#     Only ".beads/**" does the work today, because .beads holds TRACKED files
#     (config.yaml, metadata.json, README.md) and so is always enumerated
#     child-by-child; ".beads/" is what keeps the guard standing if that ever
#     stops being true.
#   runtime/compile-host/build/  —  the CMake build tree caches absolute source
#     paths. Copying it into a fresh worktree leaves compile-host:configure
#     bound to the source worktree, so it must be rebuilt in the new lane.
#     Both forms are required for the same collapsed-entry/child enumeration
#     split described above.

# fuzz/artifacts/  —  AFL++ crash artifacts. A crash the source worktree
#     found is noise in a branch that never produced it; the seed corpora that
#     DO belong to every worktree are tracked, so this step never sees them.
#   coverage/  —  llvm-cov output, and the exclusion is about the REPORT, not
#     the cost of copying one: a report carried into a branch describes the
#     SOURCE tree's lines and reads as this branch's own, which is a wrong
#     answer rather than a slow one. `coverage:check` regenerates it.
#
# Which ignored entries get excluded is decided by principle, not by precedent
# (owner ruling, 2026-08-10):
#
#   CACHES ARE COPIED, deliberately, and no cache is singled out for exclusion.
#     Warming them is the point of this step; the copy is a reflink, so it
#     costs no disk on a copy-on-write filesystem until something writes.
#     Staleness is not grounds for exclusion — a cache that misreports after
#     the tree moves under it misreports the same way IN PLACE, so excluding it
#     here hides a defect in the cache instead of fixing it. (This retired the
#     .rumdl_cache exclusion, whose stated reason was exactly that: rumdl keys
#     per file and does not invalidate on configuration change, and on
#     2026-08-06 it reported MD057 "does not exist" against a link target
#     created after the cache warmed — reproducible with no copy involved.)
#   EXCLUSIONS EXIST FOR TWO REASONS, and each entry above or below names one:
#     cross-session state a fresh worktree must not inherit (.beads and the
#     session briefs), and artifacts that BREAK when copied — the class of
#     environments that bake absolute paths at creation time and resolve to
#     the source worktree afterwards. The compile-host build tree is the
#     current instance of that second class.
#
# Deliberately NOT excluded, so the reflink copy happens:
#
#   target/, fuzz/target/  —  a warm build cache is most of what this step is
#     for, and a reflink costs no disk on APFS until something writes. Owner
#     ruling, 2026-08-06.
#   node_modules/  —  same reasoning, and it is relocatable: every symlink in
#     it is relative and its .bin shims resolve through $basedir, so a copy
#     runs the copy's own toolchain rather than the source worktree's.
#   .lavish/  —  rendered review surfaces. Its .gitignore block files it with
#     the session briefs, but it is generated OUTPUT rather than live
#     coordination state, and inheriting it costs a branch nothing. Owner
#     ruling, 2026-08-10.
#
# Four patterns were deleted rather than repaired (gandr-vibl), because each
# names something that should be copied or nothing at all:
#
#   target/**  never matched: `target` at .gitignore:1 covers the directory
#     itself, so git hands it over collapsed as the single entry "target".
#   crates/tree-sitter/target/**  names a path absent from the tree, and its
#     stated premise was false in both halves — the generic `target` rule
#     carries no leading slash, so it is not root-anchored and already matches
#     at every depth, and a nested `/**` pattern would not have matched a
#     collapsed entry anyway.
#   fuzz/target/**  also absent, and covered by the same build-cache ruling.
#   packages/tree-sitter-gandr/node_modules/**  absent, and it never named the
#     node_modules that is actually copied, which is the one at the repo root.
[step.copy-ignored]
exclude = [
  ".beads/",
  ".beads/**",
  "runtime/compile-host/build/",
  "runtime/compile-host/build/**",
  "coverage/",
  "coverage/**",
  "fuzz/artifacts/",
  "fuzz/artifacts/**",
  # The session briefs. A wholly ignored root-level FILE arrives from the
  # enumeration as its exact path, so the bare name is the form that matches
  # and the doubling above does not apply; a fresh worktree must not inherit
  # another session's live state or another session's brief.
  "PROMPT.md",
  "SESSION.md",
]
