# Repository nextest configuration.
#
# nextest dispatches tests in list order within one priority tier, so a slow
# test listed late forms a serial tail at the end of the run. The overrides
# below give the measured-slow tests explicit priority (higher runs sooner,
# stable within a tier) so they start in the first wave instead.
#
# Durations and completion positions measured 2026-08-16 from a full-suite
# dev-profile run (2603 tests, 38.4s wall): the two theory-graphs tests below
# finished at completion positions 2602/2603 and 2603/2603, a ~21s near-serial
# tail. The tier values follow measured duration; re-derive from a fresh
# sorted PASS-duration listing when the suite's cost profile shifts.

[[profile.default.overrides]]
# 16.4s, finished 2603/2603.
filter = "test(capacity_beyond_u16_is_typed)"
priority = 100

[[profile.default.overrides]]
# 15.4s.
filter = "test(a_repeated_diamond_dag_is_rejected_before_the_checker)"
priority = 95

[[profile.default.overrides]]
# 14.9s.
filter = "test(a_many_segment_amplification_is_rejected_before_the_checker)"
priority = 94

[[profile.default.overrides]]
# 14.1s, finished 2602/2603.
filter = "test(deep_acyclic_chain_uses_iterative_graph_algorithms)"
priority = 90

[[profile.default.overrides]]
# 9.7s.
