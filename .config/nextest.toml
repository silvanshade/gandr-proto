# Repository nextest configuration.
#
# nextest dispatches tests in list order within one priority tier, so a slow
# test listed late forms a serial tail at the end of the run. The overrides
# below give the measured-slow tests explicit priority (higher runs sooner,
# stable within a tier) so they start in the first wave instead, plus one
# package-level bump for gandr-theory-virtual-doctrines, whose many 1-3s
# randomized cospan tests otherwise pool at the tail as a class.
#
# Durations and completion positions re-derived 2026-08-16 from a full-suite
# dev-profile run (2639 tests, 14.6s wall) after the gandr-gxjh heavy-test
# fixes landed: an earlier table named tests whose costs were defects (now
# fixed) rather than intrinsic. Re-derive from a fresh sorted PASS-duration
# listing when the suite's cost profile shifts.

[[profile.default.overrides]]
# 8.0s. Intrinsic: constructs a genuine 2^18-entry artifact, twice.
filter = "test(the_table_size_boundary_accepts_at_the_cap_and_rejects_over)"
priority = 100

[[profile.default.overrides]]
# 6.1s. Intrinsic: exhaustive ends² walk-matrix over the real grammar.
filter = "test(walk_lengths_respect_the_chain_cap)"
priority = 95

[[profile.default.overrides]]
# 5.8s. Same walk-matrix class.
filter = "test(walks_terminate_for_every_symbol_pair)"
priority = 94

[[profile.default.overrides]]
# 4.5s. Randomized confluence search; dev-profile ChaCha dominates.
filter = "test(confluence_cospans_factor_uniquely)"
priority = 90

[[profile.default.overrides]]
# 4.2s. Same class.
filter = "test(composition_cospans_factor_uniquely)"
priority = 88

[[profile.default.overrides]]
# 3.6s. Randomized differential totality run.
filter = "test(l_machine_is_total_and_deterministic)"
priority = 85

[[profile.default.overrides]]
# 3.4s.
filter = "test(deep_decoded_declaration_drop_is_total)"
priority = 83

[[profile.default.overrides]]
# 3.2s, finished 2639/2639 (dead last) in the derivation run.
filter = "test(multi_sum_families_are_degenerate_singletons)"
priority = 80

# The virtual-doctrines cospan/differential tests cluster at 1-3s each and
# pooled at the tail (completion positions 2609-2639 of 2639) without a bump.
[[profile.default.overrides]]
filter = "package(gandr-theory-virtual-doctrines)"
priority = 40
