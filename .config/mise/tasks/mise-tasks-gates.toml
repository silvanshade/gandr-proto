#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# Parked gate entries, restored with the pieces they check: grammar:test
# returns with the surface-grammar port (see the parked task above).
# Wall order: the cheap drift/docs checks fail fast up front (pin-check first,
# its fcw.13 position), then the Rust sweep; treefmt stays last as the
# whole-tree normalization check. cargo:dylint:local (strict) joins
# cargo:dylint:recursion so the primitive-boundary lane gates merges again
# (gandr-vp8 tracks restoring the excluded crates).
["gate:merge"]
description = "Run the native pre-merge gate"
run = [
  { task = "toolchain:pin-check" },
  { task = "docs:conflict-markers" },
  { task = "docs:manifest-drift" },
  { task = "docs:reference-integrity" },
  { task = "cargo:build" },
  { task = "cargo:clippy" },
  { task = "cargo:dylint:recursion" },
  { task = "cargo:dylint:local" },
  { task = "cargo:doc-check" },
  { task = "cargo:nextest" },
  { task = "treefmt:check" }
]
