#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# Parked gate entries, restored with the pieces they check: toolchain:pin-check
# returns when the fcw.13 toolchain pin gate is rebuilt; grammar:test returns
# with the surface-grammar port (see the parked task above).
["gate:merge"]
description = "Run the native pre-merge gate"
run = [
  { task = "cargo:build" },
  { task = "cargo:clippy" },
  { task = "cargo:dylint:recursion" },
  { task = "cargo:doc-check" },
  { task = "cargo:nextest" },
  { task = "treefmt:check" }
]
