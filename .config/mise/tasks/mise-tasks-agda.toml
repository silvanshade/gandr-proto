#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# ── Agda metatheory (metatheory/; Agda is the sole proof vehicle) ───────────────
# Agda 2.8.0 (pinned in mise.toml [tools]). The metatheory is built PORT-AS-SOURCE
# under `Gandr.*`: there is no internal-univalence submodule and no `iu:check` pin
# gate. Adding an Agda dependency is vetted first — see docs/workflow/agda.md.
#
# Strict root / holey leaf (docs/workflow/agda.md): `agda:check` gates the strict
# root `Gandr.Everything` at zero diagnostics. A DECLARED holey leaf — a module the
# root does not import, carrying in-progress obligations as interaction holes — gets
# its own line with `--expected-code UnsolvedInteractionMetas`, so exactly the
# declared holes are tolerated and anything else still fails. There are no holey
# leaves today; add the line WITH the leaf it declares, never ahead of one.

["agda:deps"]
description = "Vendor the pinned agda-stdlib (v2.4, verified under Agda 2.8.0) into the gitignored metatheory vendor tree"
# REQUIRED BEFORE `agda:check`: the tree imports agda-stdlib directly
# (docs/workflow/agda.md), so it does not type-check without the vendored copy.
# Still a separate task rather than a dependency, so a warm tree does not
# re-enter the fetch path on every gate run.
# Idempotent: an existing checkout is left alone.
run = '''
set -eu
dest=metatheory/vendor/agda-stdlib
if [ -d "$dest" ]; then
  echo "agda-stdlib already vendored at $dest"
else
  mkdir -p metatheory/vendor
  git clone --depth 1 --branch v2.4 https://github.com/agda/agda-stdlib.git "$dest"
  echo "vendored agda-stdlib v2.4 at $dest"
fi
'''

["agda:check"]
description = "Type-check the gandr Agda metatheory under Agda 2.8.0 (strict root via aifix + OPTIONS policy sweep)"
run = """
aifix batch agda --fail-on-diagnostics -- -v0 -i metatheory/src -i metatheory/vendor/agda-stdlib/src --warning=noUnsupportedIndexedMatch metatheory/src/Gandr/Everything.agda
cargo run --quiet -p gandr-workflow-gates -- options-policy --workspace-root .
"""
