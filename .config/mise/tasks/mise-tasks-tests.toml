["test:doc-gates"]
description = "Run the Rust doc-gate regression suite"
run = """
cargo nextest run -p gandr-workflow-gates
"""

["test:gate-parity"]
description = "Verify scheduled tasks and local hooks share exact self-contained gate definitions"
run = """
cargo nextest run -p gandr-workflow-gates
"""

["test:graph-boundary"]
description = "Run the live theory-graphs façade boundary gate (gandr-graph, ported in wave 1)"
run = """
cargo run --quiet -p gandr-workflow-gates -- graph-boundary --workspace-root .
"""

["test:graph-gates"]
description = "Run gandr-workflow-gates Rust tests once, then both live graph gates"
run = """
cargo nextest run -p gandr-workflow-gates
cargo run --quiet -p gandr-workflow-gates -- contracts --scope crates/theory-graphs
cargo run --quiet -p gandr-workflow-gates -- graph-boundary --workspace-root .
"""

["test:options-policy"]
description = "Run the Rust OPTIONS-policy regression suite and live policy sweep"
run = """
cargo nextest run -p gandr-workflow-gates
cargo run --quiet -p gandr-workflow-gates -- options-policy --workspace-root .
"""

["test:page-balance"]
description = "Run the Rust page-balance regression suite"
run = """
cargo nextest run -p gandr-workflow-gates
"""

["test:soundness-oracles"]
description = "Verify every free-generator coherence oracle in the conformance suite declares a biased companion (ADR-48)"
run = """
cargo run --quiet -p gandr-workflow-gates -- soundness-oracles --workspace-root .
"""

