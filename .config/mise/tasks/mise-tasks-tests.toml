["test:adequacy-witnesses"]
description = "Run the live graph rustdoc Contract adequacy-witness gate"
run = """
cargo run --quiet -p gandr-workflow-gates -- contracts --scope crates/theory-graphs
"""

["test:coverage-ratchet"]
description = "Verify per-file coverage floors, monotonicity, schema validation, and path boundaries"
run = """
cargo nextest run -p gandr-workflow-gates
"""

