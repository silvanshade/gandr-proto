# description = "Release no_panic link smoke (Grade leaf ops)"
# run = """
# cargo build --release -p gandr-core --example no_panic_smoke
# """

["cargo:miri"]
description = "Run the workspace test suite under Miri"
run = """
RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN_NIGHTLY" cargo miri test --workspace --all-targets --features=full
"""
