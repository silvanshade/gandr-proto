#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The C++26 MLIR compilation host under runtime/compile-host.
#
# MLIR is PINNED. runtime/compile-host/cmake/mlir-pin.cmake names one revision,
# one version and one sha256, and it is the only place any of the three is
# written; these tasks parse it rather than restating it. Until the source
# build lands, the local bootstrap satisfies the pin from an installed
# toolchain, and the pin's force is an equality check: a toolchain that is not
# the pinned version is refused, never accepted as a substitute. Nothing here
# may lean on a discovered-toolchain posture — that reading is retired.
#
# Where a prefix is looked for, it is a search for the PINNED toolchain rather
# than for whatever is installed: GANDR_MLIR_PREFIX wins, then a Homebrew llvm
# keg, then llvm-config on PATH, and each candidate must report the pinned
# version. The compiling clang must be the one that ships beside it — the CMake
# configure refuses a mismatch, because an ODR mismatch across that boundary
# surfaces far from its cause.
#
# One of these tasks IS on the merge wall: compile-host:wall, at the bottom of
# this file. It has no absence skip: the pin is what lets the wall assume the
# toolchain, so an absent or wrong-version MLIR is a failure and every
# configure, format, tidy, build, test, differential and bridge failure after
# it is fatal. The rest of the tasks are the pieces it composes and are not
# separately on the wall.
#
# Two things ride the wall unconditionally beside it: the Rust half of the
# host's agreement differential (the fixture against the L machine), and the
# source-level contract gate in crates/runtime-compile-host, both inside
# cargo:nextest.

# The pinned toolchain's prefix, resolved once and named so every task below
# asks the same question the same way.
#
# This is a search for the PINNED toolchain, not for whatever is installed:
# every candidate is checked against the version in
# runtime/compile-host/cmake/mlir-pin.cmake, and a candidate that is not it is
# refused rather than used. The pin file is parsed here rather than restated,
# so moving the pin moves every consumer at once.
["compile-host:pin"]
description = "Print the pinned MLIR revision, version, sha256 and archive as shell assignments"
run = '''
set -eu
pin=runtime/compile-host/cmake/mlir-pin.cmake
[ -r "$pin" ] || { echo "compile-host: $pin is unreadable" >&2; exit 1; }

# One pass over the file: a `set(NAME` opens a binding, and the first quoted
# string after it is its value, whether it sits on the same line or the next.
# The formatter is free to wrap a long value without breaking this.
values=$(awk '
  /^set\(GANDR_MLIR_PIN_(REVISION|VERSION|SHA256|ARCHIVE)/ {
    name = $0
    sub(/^set\(/, "", name)
    sub(/[^A-Z0-9_].*$/, "", name)
    pending = name
  }
  pending != "" {
    line = $0
    if (match(line, /"[^"]*"/)) {
      value = substr(line, RSTART + 1, RLENGTH - 2)
      print pending "=" value
      pending = ""
    }
  }
' "$pin")

for key in REVISION VERSION SHA256 ARCHIVE; do
  case "$values" in
    *"GANDR_MLIR_PIN_$key="*) ;;
    *) echo "compile-host: $pin carries no GANDR_MLIR_PIN_$key" >&2; exit 1 ;;
  esac
done
printf '%s\n' "$values"
'''

["compile-host:prefix"]
description = "Resolve the install prefix that satisfies the MLIR pin, or fail naming why it does not"
run = '''
set -eu
eval "$(mise run compile-host:pin)"

satisfies() {
  candidate=$1
  [ -n "$candidate" ] || return 1
  [ -d "$candidate/lib/cmake/mlir" ] || return 1
  [ -x "$candidate/bin/clang++" ] || return 1
  found=$(sed -n 's/^set(LLVM_PACKAGE_VERSION \(.*\))$/\1/p' "$candidate/lib/cmake/llvm/LLVMConfig.cmake" 2>/dev/null | head -n 1)
  [ "$found" = "$GANDR_MLIR_PIN_VERSION" ]
}

for candidate in \
  "${GANDR_MLIR_PREFIX:-}" \
  "$(command -v brew >/dev/null 2>&1 && brew --prefix llvm 2>/dev/null || true)" \
  "$(command -v llvm-config >/dev/null 2>&1 && llvm-config --prefix || true)"
do
  if satisfies "$candidate"; then
    printf '%s\n' "$candidate"
    exit 0
  fi
done

echo "compile-host: no installation satisfies the pin $GANDR_MLIR_PIN_REVISION ($GANDR_MLIR_PIN_VERSION)." >&2
echo "compile-host: MLIR is pinned, so this is a failure rather than an absence." >&2
echo "compile-host: install the pinned toolchain, or point GANDR_MLIR_PREFIX at one whose lib/cmake/mlir, bin/clang++ and LLVM_PACKAGE_VERSION all agree with it." >&2
exit 1
'''

["compile-host:configure"]
description = "Configure the C++26 MLIR compilation host against the pinned MLIR installation"
run = '''
set -eu

# A CMakeCache.txt records absolute paths, so a build directory that reached
# this checkout from another one names a source tree that is not this one, and
# cmake refuses it far from any cause a reader can act on: the pre-merge hook
# then fails a branch whose own wall was green, which is gandr-i33v's
# observable reproduction. Two keys must agree with this checkout or the whole
# cache is wrong, and they catch different failures with the same symptom:
# CMAKE_HOME_DIRECTORY names the source tree and catches a build directory
# copied between checkouts, while CMAKE_CACHEFILE_DIR names where the cache
# itself was written and catches a cache that moved rather than a tree that
# did. Removing is right where an in-place repair is not: every derived path
# hangs off these two fields, so a partially repaired cache would be
# internally consistent and externally wrong, which is worse than no cache.
# copy-ignored stopped carrying this directory into lanes at gandr-j76b; this
# guard is what meets one that already holds a stale one. A cache whose keys
# cannot be read is treated as stale rather than trusted: an absent or
# truncated entry compares as a mismatch, which removes and reconfigures.
build="${GANDR_COMPILE_HOST_BUILD:-runtime/compile-host/build}"
checkout=$(pwd -P)
# Resolve before comparing or removing. A literal path can carry .. or symlink
# steps that walk around a string comparison, so the value the refusal checks
# and the value rm -rf removes must both be the resolved directory, and they
# must be one value rather than two names for one thing.
if ! build_abs=$(cd "$build" 2>/dev/null && pwd -P); then
  printf 'compile-host: refusing stale-cache handling: cannot enter build directory %s\n' "$build" >&2
  exit 1
fi

# The removal target comes from the environment, and this task runs inside
# every lane pre-merge hook, so the failure mode is not a hypothetical future
# typo: it is a typo or a stale export in one of the worktrees running
# tonight, deleting a lane carrying hours of uncommitted work at the exact
# moment its owner is trying to land. An unlikely, catastrophic and
# unrecoverable outcome inside a mutex-held operation is not a risk to price,
# it is a shape to make unrepresentable: the guard refuses to name a directory
# it must never remove, and fails loudly saying which forbidden path was
# named, because a stale cache at a forbidden path is a configuration error
# somebody needs to see.
forbidden=
case "$build_abs" in
  "/") forbidden="/" ;;
  "$checkout") forbidden="the checkout itself ($build_abs)" ;;
  "$checkout/runtime/compile-host") forbidden="the compilation host source tree ($build_abs)" ;;
esac
if [ -f "$build/CMakeCache.txt" ]; then
  if [ -n "$forbidden" ]; then
    printf 'compile-host: refusing stale-cache removal: GANDR_COMPILE_HOST_BUILD resolves to %s; fix the variable\n' "$forbidden" >&2
    exit 1
  fi
  cached_home=$(sed -n 's/^CMAKE_HOME_DIRECTORY:[^=]*=//p' "$build/CMakeCache.txt")
  cached_cache_dir=$(sed -n 's/^CMAKE_CACHEFILE_DIR:[^=]*=//p' "$build/CMakeCache.txt")
  stale=
  if [ "$cached_home" != "$checkout/runtime/compile-host" ]; then
    printf 'compile-host: stale CMake cache: CMAKE_HOME_DIRECTORY is %s but this checkout compiles %s; removing %s\n' \
      "$cached_home" "$checkout/runtime/compile-host" "$build_abs" >&2
    stale=1
  fi
  if [ "$cached_cache_dir" != "$build_abs" ]; then
    printf 'compile-host: stale CMake cache: CMAKE_CACHEFILE_DIR is %s but this build directory is %s; removing %s\n' \
      "$cached_cache_dir" "$build_abs" "$build_abs" >&2
    stale=1
  fi
  if [ -n "$stale" ]; then
    rm -rf "$build_abs"
  fi
fi

prefix=$(mise run compile-host:prefix)
echo "compile-host: pinned MLIR at $prefix"
cmake \
  -S runtime/compile-host \
  -B "${GANDR_COMPILE_HOST_BUILD:-runtime/compile-host/build}" \
  -G Ninja \
  -DCMAKE_BUILD_TYPE="${GANDR_COMPILE_HOST_BUILD_TYPE:-Release}" \
  -DCMAKE_C_COMPILER="$prefix/bin/clang" \
  -DCMAKE_CXX_COMPILER="$prefix/bin/clang++" \
  -DMLIR_DIR="$prefix/lib/cmake/mlir"
'''

["compile-host:build"]
description = "Build the compilation host, its test binary, and its fuzz entry"
depends = ["compile-host:configure"]
run = '''
set -eu
cmake --build "${GANDR_COMPILE_HOST_BUILD:-runtime/compile-host/build}"
'''

["compile-host:test"]
description = "Run the compilation host's regression suite"
depends = ["compile-host:build"]
run = '''
set -eu
ctest --test-dir "${GANDR_COMPILE_HOST_BUILD:-runtime/compile-host/build}" --output-on-failure
'''

# The conventions contract's two enforcement surfaces, as gated lanes rather
# than as something a contributor is trusted to have run. `runtime/.clang-format`
# and `runtime/.clang-tidy` are the policy; these tasks only apply it.
#
# Both use the clang-format and clang-tidy that ship beside the PINNED MLIR, so
# the answer does not depend on which clang happens to be on PATH — a
# formatter of a different vintage reflows differently and a tidy of a
# different vintage knows different checks.
["compile-host:format"]
description = "Check the compilation host's sources against runtime/.clang-format"
run = '''
set -eu
prefix=$(mise run compile-host:prefix)
formatter="$prefix/bin/clang-format"
[ -x "$formatter" ] || { echo "compile-host: the pinned toolchain at $prefix ships no clang-format" >&2; exit 1; }

listing=$(mktemp)
trap 'rm -f "$listing"' EXIT
find runtime/compile-host/src runtime/compile-host/include runtime/compile-host/tests runtime/compile-host/tools \
  -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) | sort > "$listing"

# Redirected rather than piped, so the loop runs in this shell and the failure
# it records survives it.
status=0
while read -r file; do
  if ! "$formatter" --style=file:runtime/.clang-format "$file" | diff -u "$file" - > /dev/null; then
    echo "compile-host: $file is not what runtime/.clang-format produces" >&2
    "$formatter" --style=file:runtime/.clang-format "$file" | diff -u "$file" - >&2 || true
    status=1
  fi
done < "$listing"

if [ "$status" -ne 0 ]; then
  echo "compile-host: run the same clang-format with -i to fix" >&2
  exit 1
fi
echo "compile-host: every source is what runtime/.clang-format produces"
'''

# The tidy lane needs a BUILT tree, not merely a configured one: the compile
# database names the module-map response files that the build writes, and
# clang-tidy replays the same command line. Findings are errors here — the tree
# is clean, and the point of a lane is that it stays that way.
["compile-host:tidy"]
description = "Check the compilation host's sources against runtime/.clang-tidy"
depends = ["compile-host:build"]
run = '''
set -eu
prefix=$(mise run compile-host:prefix)
build=${GANDR_COMPILE_HOST_BUILD:-runtime/compile-host/build}
runner="$prefix/bin/run-clang-tidy"
[ -x "$runner" ] || { echo "compile-host: the pinned toolchain at $prefix ships no run-clang-tidy" >&2; exit 1; }

"$runner" \
  -clang-tidy-binary "$prefix/bin/clang-tidy" \
  -clang-apply-replacements-binary "$prefix/bin/clang-apply-replacements" \
  -p "$build" \
  -config-file=runtime/.clang-tidy \
  -warnings-as-errors='*' \
  -quiet -hide-progress -j "${GANDR_COMPILE_HOST_TIDY_JOBS:-8}" \
  'runtime/compile-host/(src|tests|tools)/'
echo "compile-host: every source satisfies runtime/.clang-tidy"
'''

# The witness that the DEFAULT dependency graph acquires nothing.
#
# The `full` feature links the host, which means a `full` build needs MLIR and
# a C++ toolchain. The claim this lane holds is that the default build needs
# neither, and it is checked rather than asserted: after a default build, the
# crate's build script must have emitted no link directive at all. A build
# script that started emitting one would make every `cargo check` in the
# workspace acquire the toolchain, which is the cost the feature exists to
# bound.
["compile-host:default-graph"]
description = "Check that the bridge crate's default build emits no link directives and pulls in no host"
run = '''
set -eu

# A target directory of its own, and this is the whole reason: a `full` build
# leaves its build-script output beside a default one, so measuring in a shared
# directory reads the wrong build and reports a link the default never emitted.
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT

CARGO_TARGET_DIR="$scratch" cargo build --quiet --package gandr-runtime-compile-host

emitted=$(cat "$scratch"/debug/build/gandr-runtime-compile-host-*/output 2>/dev/null | grep 'cargo:rustc-link' || true)
if [ -n "$emitted" ]; then
  echo "compile-host: the default build emitted link directives, so it is not toolchain-free:" >&2
  printf '%s\n' "$emitted" >&2
  exit 1
fi

# And nothing in the default graph is a loader or a C++ interop crate.
graph=$(cargo tree --quiet --package gandr-runtime-compile-host --edges normal)
if printf '%s\n' "$graph" | grep -qE '(libloading|^cxx | cxx |cxx-build) v'; then
  echo "compile-host: the default dependency graph acquired a loader or a C++ interop crate" >&2
  printf '%s\n' "$graph" >&2
  exit 1
fi

echo "compile-host: the default build emits no link directives and its graph carries no host"
'''

# The differential's other half is a Rust test on the merge wall
# (crates/core-sequent/tests/compile_host_agreement.rs), which holds the same
# fixture to what the L machine answers. Passing both is what makes the
# compiled slice agree with the L machine rather than with a file.
["compile-host:differential"]
description = "Diff the compiled slice's answers against the L machine's fixture"
depends = ["compile-host:build"]
run = '''
set -eu
build=${GANDR_COMPILE_HOST_BUILD:-runtime/compile-host/build}
fixture=runtime/compile-host/fixtures/positive-core-samples.txt

expected=$(mktemp)
actual=$(mktemp)
trap 'rm -f "$expected" "$actual"' EXIT

grep -v '^#' "$fixture" | grep -v '^$' > "$expected"
"$build/gandr-compile-host" --run-samples | cut -f1,2 > "$actual"

if diff -u "$expected" "$actual"; then
  echo "compile-host: the compiled slice agrees with the L machine on every sample"
else
  echo "compile-host: the compiled slice disagrees with the L machine" >&2
  exit 1
fi
'''

["compile-host:timings"]
description = "Report the compilation host's per-program compile and execute microseconds"
depends = ["compile-host:build"]
run = '''
set -eu
build=${GANDR_COMPILE_HOST_BUILD:-runtime/compile-host/build}
printf 'program\tcompile_us\texecute_us\n'
"$build/gandr-compile-host" --timings
'''

# Deterministic replay of every committed seed through the fuzz entry. This is
# the smoke; an unbounded campaign is compile-host:fuzz and belongs on a
# schedule rather than on a landing path.
["compile-host:fuzz-smoke"]
description = "Replay every committed fuzz seed through the compilation host's entry surface"
depends = ["compile-host:build"]
run = '''
set -eu
build=${GANDR_COMPILE_HOST_BUILD:-runtime/compile-host/build}
"$build/gandr-compile-host-fuzz" runtime/compile-host/fixtures/fuzz-seeds/*.bin
echo "compile-host: every seed replayed"
'''

# AFL++ arrives with the cargo-afl tool mise already pins; its compilers live
# in that tool's own data directory rather than on PATH, so the task looks for
# them there and takes AFL_CXX as an override.
["compile-host:fuzz"]
description = "Run an AFL++ campaign over the compilation host's entry surface"
run = '''
set -eu

afl_cxx=${AFL_CXX:-}
afl_root="${XDG_DATA_HOME:-$HOME/.local/share}/afl.rs/AFLplusplus"
if [ -z "$afl_cxx" ] && [ -x "$afl_root/afl-clang-fast++" ]; then
  afl_cxx="$afl_root/afl-clang-fast++"
fi
if [ -z "$afl_cxx" ] && command -v afl-clang-fast++ >/dev/null 2>&1; then
  afl_cxx=$(command -v afl-clang-fast++)
fi
if [ -z "$afl_cxx" ]; then
  echo "compile-host: no afl-clang-fast++ found; run 'cargo afl config --build' or set AFL_CXX" >&2
  exit 1
fi
afl_fuzz=$(dirname "$afl_cxx")/afl-fuzz

prefix=$(mise run compile-host:prefix)

build=runtime/compile-host/build-fuzz
cmake \
  -S runtime/compile-host \
  -B "$build" \
  -G Ninja \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_C_COMPILER="$(dirname "$afl_cxx")/afl-clang-fast" \
  -DCMAKE_CXX_COMPILER="$afl_cxx" \
  -DMLIR_DIR="$prefix/lib/cmake/mlir" \
  -DGANDR_COMPILE_HOST_ALLOW_TOOLCHAIN_MISMATCH=ON \
  -DGANDR_COMPILE_HOST_BUILD_TESTS=OFF
cmake --build "$build" --target gandr-compile-host-fuzz

AFL_NO_UI=1 AFL_AUTORESUME=1 "$afl_fuzz" \
  -i runtime/compile-host/fixtures/fuzz-seeds \
  -o "$build/artifacts" \
  ${GANDR_COMPILE_HOST_FUZZ_SECONDS:+-V "$GANDR_COMPILE_HOST_FUZZ_SECONDS"} \
  -- "$build/gandr-compile-host-fuzz"
'''

# The mutation campaign. cargo-mutants does not reach C++, so the host carries
# a curated catalogue instead of a generated one: each row names a decision
# surface the slice defends and the edit that breaks it, and the campaign fails
# if the suite still passes. A curated set measures the tests against the
# claims rather than against an operator inventory, and the trade is stated on
# the crate page: the coverage is exactly as wide as the catalogue.
["compile-host:mutants"]
description = "Apply the compilation host's curated mutant catalogue and require the suite to catch each"
run = '''
set -eu

prefix=$(mise run compile-host:prefix)

catalogue=runtime/compile-host/mutation/catalogue.tsv
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT

survived=0
applied=0

while IFS="$(printf '\t')" read -r name file expression; do
  case "$name" in ''|'#'*) continue ;; esac
  applied=$((applied + 1))

  tree="$scratch/$name"
  rm -rf "$tree"
  cp -R runtime/compile-host "$tree"
  rm -rf "$tree/build" "$tree/build-fuzz" "$tree/build-debug"
  # The copy carries cmake/mlir-pin.cmake with it, so a mutant tree is held to
  # the same pin as the real one.

  target="$tree/$file"
  cp "$target" "$target.original"
  sed "$expression" "$target.original" > "$target"
  if cmp -s "$target" "$target.original"; then
    echo "MUTANT $name: catalogue defect — the edit matched nothing in $file" >&2
    survived=$((survived + 1))
    continue
  fi
  rm -f "$target.original"

  if ! cmake -S "$tree" -B "$tree/build" -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_C_COMPILER="$prefix/bin/clang" \
      -DCMAKE_CXX_COMPILER="$prefix/bin/clang++" \
      -DMLIR_DIR="$prefix/lib/cmake/mlir" > "$tree/configure.log" 2>&1; then
    echo "MUTANT $name: killed at configure"
    continue
  fi
  if ! cmake --build "$tree/build" > "$tree/build.log" 2>&1; then
    echo "MUTANT $name: killed at compile"
    continue
  fi
  if ctest --test-dir "$tree/build" --output-on-failure > "$tree/test.log" 2>&1; then
    echo "MUTANT $name: SURVIVED — no case noticed the edit" >&2
    survived=$((survived + 1))
  else
    echo "MUTANT $name: killed by $(grep -c 'FAILED:' "$tree/test.log" || true) failed checks"
  fi
done < "$catalogue"

echo "compile-host: $applied mutants applied, $survived survived"
[ "$survived" -eq 0 ]
'''

# The compile host's lane on gate:merge, and the exact shape of its condition.
#
# There is no condition. MLIR is pinned, and a pin is precisely the claim that
# the wall may assume the toolchain: an installation that is absent, that
# carries no lib/cmake/mlir, that ships no clang++, or that is a version other
# than the pinned one is a FAILURE of this task. The absence skip that used to
# live here — and the GANDR_COMPILE_HOST_STRICT switch that turned it off — are
# retired by the pin's execution, and the discovered-toolchain reading they
# implemented is retired with them.
#
# What that replaces is worth stating, because the skip was carefully drawn and
# the reason it existed no longer holds. It existed because requiring an
# installation the repository did not pin was a larger claim than the slice
# made. The repository pins one now, in runtime/compile-host/cmake/mlir-pin.cmake.
#
# What has NOT changed is the rule the skip's own defect taught: once anything
# after resolution fails, it is fatal. A configure failure, a format finding, a
# tidy finding, a build failure, a failing regression case, a differential
# mismatch, a bridge failure — none of them is an absence, and none of them may
# leave this task green with a reassuring message.
#
# Riding here beside the behaviour: the two conventions lanes, so conformance
# to runtime/.clang-format and runtime/.clang-tidy is gated rather than
# aspirational.
#
# Riding unconditionally elsewhere: the Rust half of the agreement differential
# and the source-level contract gate in crates/runtime-compile-host, both
# inside cargo:nextest. They remain the half that needs no toolchain at all.
["compile-host:wall"]
description = "Run the compilation host's gates against the pinned MLIR toolchain"
run = '''
set -eu

eval "$(mise run compile-host:pin)"
prefix=$(mise run compile-host:prefix)
echo "compile-host: pin $GANDR_MLIR_PIN_REVISION satisfied at $prefix; every step below is required"

mise run compile-host:configure
mise run compile-host:format
mise run compile-host:build
mise run compile-host:tidy
mise run compile-host:test
mise run compile-host:differential
mise run compile-host:fuzz-smoke
mise run compile-host:default-graph

# The bridge's cases need the linked host, so they run under the feature that
# links it. `GANDR_COMPILE_HOST_REQUIRED` is retired with the discovery it
# guarded: a build that produced this binary already resolved every entry.
cargo nextest run \
  --package gandr-runtime-compile-host \
  --all-targets \
  --features=full

echo "compile-host: the host's gates passed against $GANDR_MLIR_PIN_REVISION at $prefix"
'''

# Moving the pin, which is the only supported way it moves.
#
# The update is one command because the three facts have to move together: a
# revision without its digest is not a pin, and a digest that was transcribed
# rather than measured is not one either. This task fetches the archive for the
# named revision, hashes what it actually received, and writes revision,
# version, archive and sha256 back into cmake/mlir-pin.cmake in one edit.
#
# It does NOT install the toolchain. After a bump the local bootstrap has to
# supply the new version before anything configures again, which is the
# friction a pin is supposed to have.
["compile-host:pin-update"]
description = "Move the MLIR pin to a named llvm-project release, measuring the archive's digest"
usage = '''
flag "--revision <revision>" help="The llvm-project release tag to pin, as llvmorg-22.1.9"
'''
run = '''
set -eu

revision="{{usage.revision}}"
if [ -z "$revision" ]; then
  echo "compile-host: name the release to pin, as 'mise run compile-host:pin-update --revision llvmorg-22.1.9'" >&2
  exit 1
fi
case "$revision" in
  llvmorg-*) version=${revision#llvmorg-} ;;
  *) echo "compile-host: '$revision' is not an llvmorg-<version> tag" >&2; exit 1 ;;
esac

archive="https://github.com/llvm/llvm-project/releases/download/$revision/llvm-project-$version.src.tar.xz"
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT

echo "compile-host: fetching $archive"
if ! curl -fsSL --retry 2 -o "$scratch/archive.tar.xz" "$archive"; then
  echo "compile-host: $revision has no source archive at $archive" >&2
  exit 1
fi
sha256=$(shasum -a 256 "$scratch/archive.tar.xz" | cut -d' ' -f1)
echo "compile-host: measured sha256 $sha256"

pin=runtime/compile-host/cmake/mlir-pin.cmake
python3 - "$pin" "$revision" "$version" "$archive" "$sha256" <<'PYTHON'
import re
import sys

path, revision, version, archive, sha256 = sys.argv[1:6]
with open(path, encoding="utf-8") as handle:
    text = handle.read()

for name, value in (
    ("GANDR_MLIR_PIN_REVISION", revision),
    ("GANDR_MLIR_PIN_VERSION", version),
    ("GANDR_MLIR_PIN_SHA256", sha256),
):
    pattern = re.compile(r'^set\(' + name + r'\s+"[^"]*"\)$', re.M)
    text, count = pattern.subn(f'set({name} "{value}")', text)
    if count != 1:
        raise SystemExit(f"{path} does not carry exactly one {name}")

pattern = re.compile(r'^set\(GANDR_MLIR_PIN_ARCHIVE\n\s*"[^"]*"\n\)$', re.M)
text, count = pattern.subn(f'set(GANDR_MLIR_PIN_ARCHIVE\n    "{archive}"\n)', text)
if count != 1:
    raise SystemExit(f"{path} does not carry exactly one GANDR_MLIR_PIN_ARCHIVE")

# The comment beside the revision names the same release; keep it honest.
text = re.sub(r"llvmorg-\d+\.\d+\.\d+", revision, text)
text = re.sub(r"llvm-project-\d+\.\d+\.\d+\.src", f"llvm-project-{version}.src", text)

with open(path, "w", encoding="utf-8") as handle:
    handle.write(text)
PYTHON

echo "compile-host: pin moved to $revision; install that toolchain before configuring again"
mise run compile-host:pin
'''
