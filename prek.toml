#:tombi toml-version = "v1.0.0"
#:schema https://www.schemastore.org/prek.json

fail_fast = false
# commit-msg is required for the commitlint hook (commit-msg-staged) to install at
# all — without it the gate is dormant (agentic-dev prek.base shape; core/HAZARDS.md H4).
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "prek-validate-config"
name = "prek validate-config"
language = "system"
entry = "mise exec -- prek validate-config prek.toml"
files.glob = ["prek.toml", "mise.toml", "mise.lock"]
pass_filenames = false
stages = ["pre-commit"]

# Publishable-history backstop (core/PUBLISHABLE-HISTORY.md): machine-local home
# paths are contributor-concern and must not land in tracked content. Script-based
# per core ADR-4 — absolute home paths always flagged, tilde paths allowlisted in-script.
[[repos.hooks]]
id = "no-machine-local-paths"
name = "no machine-local paths in committed content"
language = "system"
entry = "mise exec -- nu ./scripts/check-machine-local-paths.nu"
stages = ["pre-commit"]

[[repos.hooks]]
id = "docs-conflict-markers"
name = "docs conflict-marker check"
language = "system"
entry = "mise run docs:conflict-markers"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "treefmt-check"
name = "treefmt --ci"
language = "system"
entry = "mise run treefmt:check"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "cargo-fmt-check"
name = "cargo fmt --all -- --check"
language = "system"
entry = "mise run cargo:fmt-check"
files.glob = [".cargo/cargo.toml", "**/Cargo.toml", "**/*.rs", "rustfmt.toml"]
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "docs-manifest-drift"
name = "docs manifest drift check"
language = "system"
entry = "mise run docs:manifest-drift"
files.glob = [
  # "docs/adr/**",
  # "docs/spec/**",
  "crates/workflow-gates/src/docs/**"
]
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "docs-reference-integrity"
name = "docs reference integrity check"
language = "system"
entry = "mise run docs:reference-integrity"
files.glob = [
  # "docs/adr/**",
  # "docs/spec/**",
  "crates/workflow-gates/src/docs/**"
]
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
entry = "mise x -- commitlint --edit"
language = "system"
stages = [
  "commit-msg",
]
always_run = true
pass_filenames = true

# The PUSH tier is parked while the reboot bootstraps: `workflow push` runs
# mise tasks that are not in place yet (core:check, grammar:test, cargo:dylint,
# wrkflw). Re-enable once the push-tier task surface exists.
# [[repos.hooks]]
# id = "workflow-push"
# name = "unified Rust workflow push gate"
# language = "system"
# entry = "cargo run -p gandr-workflow-gates -- workflow push"
# pass_filenames = false
# always_run = true
# stages = ["pre-push"]

[[repos.hooks]]
id = "commitlint-push-range"
name = "commitlint (push range)"
entry = "mise exec -- nu ./scripts/commitlint-range.nu"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "signed-commits"
name = "signed commits (push range)"
entry = "mise exec -- nu ./scripts/check-signed-commits.nu"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
